<!doctype html>
<html lang="zh-CN" data-page="file-upload">
<head>
  <meta charset="utf-8"/>
  <script src="/assets/route-guard.js?v=1.8"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#f5f8fc"/>
  <meta name="description" content="学分申请系统：学分申报、进度查询、文件上传与审核管理"/>
  <title>文件上传 | 学分申请系统</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="/assets/pages/file-upload.css?v=1.8"/>
  <link rel="stylesheet" href="/feedback.css"/>
  <link rel="stylesheet" href="/assets/design.css"/>
  <link rel="stylesheet" href="/assets/mobile-fixes.css?v=1.8"/>
  <link rel="stylesheet" href="/assets/mobile-v15.css?v=1.8"/>
  <script defer src="/vendor/vue.global.js"></script>
  <script defer src="/api-cache.js"></script>
  <script defer src="/sync.js"></script>
  <script defer src="/feedback.js"></script>
  <script defer src="/custom-dialog.js"></script>
  <script defer src="/assets/refresh-feedback.js?v=1.8"></script>
  <script defer src="/assets/app.js?v=1.8"></script>
</head>
<body class="page-file-upload">
  <div id="app"><div class="first-paint" aria-live="polite"><span class="first-paint-logo">学</span><span>正在打开学分服务中心</span><span class="first-paint-bar"></span></div></div>
  <template id="page-template">
  <div id="toast" class="toast"></div>
  <div class="container">
<div class="back-row">
<h2>上传文件</h2>
    </div>

    <div class="countdown-box" id="countdownBox">
      <div class="label">距离上传截止还剩</div>
      <div class="time" id="countdownTime">--:--:--</div>
    </div>

    <form id="uploadForm" enctype="multipart/form-data">
      <div class="form-row">
        <div class="form-group">
          <label>姓名 <span class="required">*</span></label>
          <input class="form-control" id="name" required />
        </div>
        <div class="form-group">
          <label>学号 <span class="required">*</span></label>
          <input class="form-control" id="studentId" required />
        </div>
      </div>
      <div class="form-group">
        <label>选择文件 <span class="required">*</span></label>
        <div class="upload-wrapper">
          <div class="upload-control">
            <input type="file" id="fileInput" multiple />
            <span class="upload-badge" id="fileCount">0 个文件</span>
          </div>
          <div class="upload-hint" id="uploadHint">支持任意格式</div>
          <div class="file-list" id="fileList"></div>
        </div>
      </div>
      <button type="submit" class="btn-submit">上传文件</button>
    </form>
  </div>

  <div class="upload-modal-overlay" id="uploadModalOverlay">
    <div class="upload-modal-card">
      <h3>
        <span class="upload-modal-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </span>
        正在上传...
      </h3>
      <div class="upload-files-list" id="uploadFilesList"></div>
      <div class="upload-progress-bar">
        <div class="upload-progress-fill" id="uploadProgressFill"></div>
      </div>
      <div class="upload-progress-text" id="uploadProgressText">0%</div>
      <button type="button" class="upload-cancel-btn" id="uploadCancelBtn" @click="invokePageAction('cancelUpload')">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
        取消上传
      </button>
    </div>
  </div>

  
</template>
  <noscript>请开启 JavaScript 以使用学分申请系统。</noscript>
</body>
</html>
