<!doctype html>
<html lang="zh-CN" data-page="admin">
<head>
  <meta charset="utf-8"/>
  <script src="/assets/theme.js?v=3.4.1"></script>
  <style id="credit-critical-paint">html{background:#f4f7fc;color-scheme:light}html[data-theme="dark"]{background:#101927;color-scheme:dark}html[data-theme="dark"] body,html[data-theme="dark"] #app{background:#101927!important;color:#e9f2ff!important}html[data-theme="dark"] #music-root{background:#101927!important;color:#e9f2ff!important}html[data-theme="light"] body{background:#f4f7fc}</style>
  <script src="/assets/music-bootstrap.js?v=2.4"></script>
  <script src="/assets/route-guard.js?v=2.2"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#f5f8fc"/>
  <meta name="description" content="学分申请系统：学分申报、进度查询、文件上传与审核管理"/>
  <title>系统管理 | 学分申请系统</title>
  <link rel="icon" href="/assets/icons/网页选项卡标题，网站logo.webp" type="image/webp">
  <link rel="stylesheet" href="/assets/pages/admin.css?v=3.4"/>
  <link rel="stylesheet" href="/assets/core.css?v=3.4.4">
  <script defer src="/vendor/vue.global.js"></script>
  <script defer src="/api-cache.js"></script>
  <script defer src="/sync.js"></script>
  <script defer src="/feedback.js?v=2.9"></script>
  <script defer src="/assets/vue-feedback.js?v=2.9"></script><script defer src="/custom-dialog.js?v=2.9"></script>
  <script defer src="/assets/refresh-feedback.js?v=2.2"></script>
  <script defer src="/assets/app.js?v=3.4.3"></script>
</head>
<body class="page-admin">
  <div id="app"><div class="first-paint" aria-live="polite"><span class="first-paint-logo"><img src="/assets/icons/网页选项卡标题，网站logo.webp" alt="学分服务中心"></span><span>正在打开学分服务中心</span><span class="first-paint-bar"></span></div></div>
  <template id="page-template">
  <div class="navbar">
    <h1>系统管理 <small>System</small></h1>
  </div>
  <div class="container">
    <div class="admin-tab-switcher">
      <label class="admin-mobile-tab-select">管理功能
        <select v-model="activeTab" @change="changeTab(activeTab)" aria-label="选择系统管理选项卡">
          <option value="admins">管理员管理</option>
          <option value="students">学生管理</option>
          <option value="messages">消息发送</option>
          <option value="tools">工具</option>
          <option value="files">文件管理</option>
          <option value="maintenance">系统维护</option>
          <option value="logs">登录日志</option>
          <option value="about">（关于）系统信息设置</option>
        </select>
      </label>
    <div class="tabs-wrap">
      <div class="tabs" role="tablist">
        <button class="tab-btn" :class="{active:activeTab==='admins'}" @click="changeTab('admins')" data-tab="admins" role="tab">管理员管理</button>
        <button class="tab-btn" :class="{active:activeTab==='students'}" @click="changeTab('students')" data-tab="students" role="tab">学生管理</button>
        <button class="tab-btn" :class="{active:activeTab==='messages'}" @click="changeTab('messages')" data-tab="messages" role="tab">消息发送</button>
        <button class="tab-btn" :class="{active:activeTab==='tools'}" @click="changeTab('tools')" data-tab="tools" role="tab">工具</button>
        <button class="tab-btn" :class="{active:activeTab==='files'}" @click="changeTab('files')" data-tab="files" role="tab">文件管理</button>
        <button class="tab-btn" :class="{active:activeTab==='maintenance'}" @click="changeTab('maintenance')" data-tab="maintenance" role="tab">系统维护</button>
        <button class="tab-btn" :class="{active:activeTab==='logs'}" @click="changeTab('logs')" data-tab="logs" role="tab">登录日志</button>
        <button class="tab-btn" :class="{active:activeTab==='about'}" @click="changeTab('about')" data-tab="about" role="tab">（关于）系统信息设置</button>
      </div>
    </div>

    </div>

    <!-- 管理员管理 -->
    <div id="tab-admins" class="tab-content" :class="{active:activeTab==='admins'}">
      <div class="card">
        <h2>管理员列表</h2>
        <div id="adminTable" aria-live="polite">
          <div v-if="adminListError" class="empty-state" role="alert">{{adminListError}}</div>
          <div v-else-if="adminRows === null"><div class="skeleton-table-row"></div><div class="skeleton-table-row"></div></div>
          <div v-else-if="adminRows.length === 0" class="empty-state">暂无管理员</div>
          <table v-else class="vue-admin-table">
            <thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>审核权限</th><th>封禁权限</th><th>操作</th></tr></thead>
            <tbody>
              <tr v-for="u in adminRows" :key="u.id || u.username">
                <td>{{u.id}}</td><td>{{u.username}}</td><td>{{u.role}}</td>
                <td><button class="toggle-btn" :class="{active:!!u.auditPermission}" @click="invokePageAction('togglePerm', $event.currentTarget, u.username, !!u.auditPermission)">{{u.auditPermission ? '开启':'关闭'}}</button></td>
                <td><button class="toggle-btn" :class="{active:!!u.canBan}" @click="invokePageAction('toggleBanPerm', $event.currentTarget, u.username, !!u.canBan)">{{u.canBan ? '允许':'禁止'}}</button></td>
                <td><button v-if="u.role !== 'system'" class="btn btn-danger btn-small" @click="invokePageAction('deleteAdmin', $event.currentTarget, u.username)">删除</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <h2>创建管理员</h2>
        <div class="row">
          <div class="form-group"><label>用户名</label><input class="form-control" id="newUsername" placeholder="用户名" /></div>
          <div class="form-group"><label>密码（至少8位）</label><input class="form-control" id="newPassword" type="password" placeholder="密码" /></div>
        </div>
        <div class="form-group"><label>角色</label>
          <select class="form-control" id="newRole">
            <option value="admin">Admin</option>
            <option value="system">System</option>
          </select>
        </div>
        <button class="btn btn-primary" @click="invokePageAction('createAdmin', $event.currentTarget)">创建管理员</button>
      </div>
    </div>

    <!-- 学生管理 -->
    <div id="tab-students" class="tab-content" :class="{active:activeTab==='students'}">
      <div class="card">
        <h2>学生名单</h2>
        <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px;">
          <button class="btn btn-danger" @click="invokePageAction('deleteSelectedStudents', $event.currentTarget)" :disabled="adminStudentsSelectedCount===0 || adminStudentsLoading">删除选中</button>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
            <input type="checkbox" id="selectAllStudents" :checked="adminStudentsAllSelected" @change="adminSelectAllStudents($event.target.checked)"> 全选
          </label>
          <span style="color:#718096;font-size:14px;">已选 <strong id="selectedCount">{{adminStudentsSelectedCount}}</strong> 人</span>
        </div>
        <div style="overflow-x:auto;">
          <table>
            <thead><tr>
              <th><input type="checkbox" class="checkbox" id="selectAllTable" :checked="adminStudentsAllSelected" @change="adminSelectAllStudents($event.target.checked)"></th>
              <th>姓名</th>
              <th>学号</th>
              <th>密码</th>
              <th>状态</th>
              <th>操作</th>
            </tr></thead>
            <tbody id="studentTableBody">
              <tr v-if="adminStudentsLoading"><td colspan="6" class="empty-state">正在加载学生名单…</td></tr>
              <tr v-else-if="adminStudentsError"><td colspan="6" class="empty-state" role="alert">{{adminStudentsError}}</td></tr>
              <tr v-for="s in adminStudentsRows" :key="String(s.studentId)">
                <td><input type="checkbox" class="checkbox student-checkbox" :value="String(s.studentId)" :checked="!!adminStudentSelected[String(s.studentId)]" @change="adminSelectStudent(s.studentId,$event.target.checked)"></td>
                <td>{{s.name}}</td><td>{{s.studentId}}</td>
                <td><code v-if="s.password" class="pwd-code">{{s.password}}</code><span v-else class="text-muted">未设置</span></td>
                <td><span class="badge" :class="s.banned?'badge-danger':'badge-success'">{{s.banned?'已封禁':'正常'}}</span></td>
                <td><div class="admin-student-actions">
                  <button class="btn btn-warning btn-small" @click="invokePageAction('resetStudentPassword',$event.currentTarget,s.studentId,s.password||'')">重置密码</button>
                  <button class="btn btn-warning btn-small" @click="invokePageAction('toggleBanStudent',$event.currentTarget,s.studentId,!!s.banned)">{{s.banned?'解封':'封禁'}}</button>
                </div></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div id="studentEmpty" v-if="adminStudentsEmpty" class="empty-state">暂无学生数据</div>
      </div>

      <div class="card">
        <h2>手动添加学生</h2>
        <div class="row">
          <div class="form-group"><label>姓名</label><input class="form-control" id="newStudentName" placeholder="姓名" /></div>
          <div class="form-group"><label>学号</label><input class="form-control" id="newStudentId" placeholder="学号" /></div>
        </div>
        <div class="form-group"><label>登录密码（可留空，学生将无法登录）</label><input class="form-control" id="newStudentPassword" placeholder="为学生设置登录密码" /></div>
        <button class="btn btn-primary" @click="invokePageAction('addStudent', $event.currentTarget)">添加</button>
      </div>

      <div class="card">
        <h2>批量导入（xls / xlsx）</h2>
        <p style="color:#6b7280;font-size:14px;margin-bottom:8px;">文件需包含列：<strong>姓名</strong> 和 <strong>学号</strong>，可选 <strong>密码</strong> 列</p>
        <div class="admin-settings-actions">
          <input type="file" id="fileInput" accept=".xls,.xlsx" :disabled="adminImportBusy" @change="adminImportPickFile($event)" aria-label="选择学生 Excel 文件" />
          <button class="btn btn-success" :disabled="adminImportBusy || !adminImportFile" @click="invokePageAction('importStudents', $event.currentTarget)">{{adminImportBusy?'正在导入…':'导入'}}</button>
        </div>
        <p v-if="adminImportFile" class="admin-muted">已选择：{{adminImportFile.name}}</p>
        <div v-if="adminImportResult" id="importResult" class="admin-vue-result" role="status">{{adminImportResult}}</div>
        <div v-if="adminImportVisible" id="importProgress" class="import-progress admin-vue-import-progress" role="progressbar" :aria-valuenow="adminImportPercent" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar"><div class="progress-fill" :style="{width:adminImportPercent+'%'}"></div></div>
          <div class="progress-text">{{adminImportPercent}}%（{{adminImportDone}}/{{adminImportTotal}}）</div>
        </div>
        <details v-if="adminImportFailures.length" class="admin-muted"><summary>查看失败记录（{{adminImportFailures.length}} 条）</summary><div v-for="(message,index) in adminImportFailures" :key="index">{{message}}</div></details>
      </div>
    </div>

    <!-- 消息发送 -->
    <div id="tab-messages" class="tab-content" :class="{active:activeTab==='messages'}">
      <div class="card">
        <h2>向学生发送消息</h2>
        <div class="form-group">
          <label>选择接收学生（可多选）</label>
          <div style="margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-outline btn-small" @click="adminSelectAllMessageStudents(true)">全选</button>
            <button class="btn btn-outline btn-small" @click="adminSelectAllMessageStudents(false)">清空选择</button>
            <span style="color:#6b7a8f;font-size:13px;align-self:center;">已选 <strong id="msgSelectedCount">{{adminMessageSelectedCount}}</strong> 人</span>
          </div>
          <div class="student-select-list" id="msgStudentList" aria-live="polite">
            <div v-if="adminMessageStudentsLoading" class="empty-state">正在加载接收学生…</div>
            <div v-else-if="adminMessageStudentsError" class="empty-state" role="alert">{{adminMessageStudentsError}}</div>
            <div v-else-if="!adminMessageStudents.length" class="empty-state">暂无学生</div>
            <label v-for="s in adminMessageStudents" :key="String(s.studentId)" class="student-option">
              <input type="checkbox" :value="String(s.studentId)" :checked="!!adminMessageSelected[String(s.studentId)]" @change="adminToggleMessageStudent(s.studentId,$event.target.checked)">
              <span class="student-name">{{s.name}}</span><span class="student-id">{{s.studentId}}</span>
            </label>
          </div>
        </div>
        <div class="form-group">
          <label>消息标题</label>
          <input class="form-control" id="msgTitle" placeholder="请输入消息标题" />
        </div>
        <div class="form-group">
          <label>消息内容</label>
          <textarea class="form-control" id="msgContent" rows="5" placeholder="请输入消息内容..."></textarea>
        </div>
        <button class="btn btn-primary" :disabled="adminProgress.busy" @click="invokePageAction('sendCustomMessage', $event.currentTarget)">发送消息</button>
        <div v-if="adminMessageResult" id="msgSendResult" class="admin-vue-result" role="status">{{adminMessageResult}}</div>
      </div>
    </div>

    <!-- 工具 -->
    <div id="tab-tools" class="tab-content" :class="{active:activeTab==='tools'}">
      <div class="card">
        <h2>修改其他账户密码</h2>
        <div class="row">
          <div class="form-group"><label>用户名</label><input class="form-control" id="changePwdUsername" placeholder="用户名" /></div>
          <div class="form-group"><label>新密码（至少8位）</label><input class="form-control" id="changePwdNewPwd" type="password" placeholder="新密码" /></div>
        </div>
        <button class="btn btn-warning" @click="invokePageAction('changePassword', $event.currentTarget)">修改密码</button>
      </div>

      <div class="card">
        <h2>学分申请入口开关</h2>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;">
          <label style="font-weight:500;">申请入口状态：</label>
          <button id="toggleEntryBtn" class="btn" :class="adminEntryEnabled?'btn-danger':'btn-success'" @click="adminEntryEnabled=!adminEntryEnabled">{{adminEntryEnabled?'关闭':'开启'}}</button>
          <span id="entryStatus" class="admin-setting-status" :class="adminEntryEnabled?'state-on':'state-off'">当前：{{adminEntryEnabled?'开启':'关闭'}}</span>
        </div>
        <div class="form-group">
          <label>自定义提示文字（当入口关闭时显示）</label>
          <textarea class="form-control" id="entryMessage" v-model="adminEntryMessage" rows="3"></textarea>
        </div>
        <button class="btn btn-primary" @click="invokePageAction('saveEntrySettings', $event.currentTarget)">保存设置</button>
        <div v-if="adminEntryResult" id="entrySaveResult" class="admin-vue-result" role="status">{{adminEntryResult}}</div>
      </div>

      <div class="card">
        <h2>文件上传设置</h2>
        <div class="admin-settings-actions">
          <label>文件上传入口：</label>
          <button id="toggleFileUploadBtn" class="btn" :class="adminUploadEnabled?'btn-danger':'btn-success'" @click="adminUploadEnabled=!adminUploadEnabled">{{adminUploadEnabled?'关闭':'开启'}}</button>
          <span id="fileUploadStatus" class="admin-setting-status" :class="adminUploadEnabled?'state-on':'state-off'">当前：{{adminUploadEnabled?'开启':'关闭'}}</span>
        </div>
        <div class="admin-settings-actions">
          <label>允许多文件上传：</label>
          <button id="toggleMultipleBtn" class="btn" :class="adminUploadMultiple?'btn-danger':'btn-success'" @click="adminUploadMultiple=!adminUploadMultiple">{{adminUploadMultiple?'禁止':'允许'}}</button>
          <span id="multipleStatus" class="admin-setting-status" :class="adminUploadMultiple?'state-on':'state-off'">当前：{{adminUploadMultiple?'允许':'禁止'}}</span>
        </div>
        <div class="form-group">
          <label for="maxSubmissions">每个学生最大提交次数</label>
          <input type="number" class="form-control" id="maxSubmissions" v-model.number="adminUploadMaxSubmissions" min="1" step="1" />
        </div>
        <fieldset class="admin-setting-fieldset">
          <legend>单个文件大小限制</legend>
          <div class="admin-settings-actions">
            <label v-for="opt in ['20','50','100','custom']" :key="opt" class="admin-radio-option"><input type="radio" name="fileSizeMode" :value="opt" v-model="adminUploadFileSizeMode">{{opt==='custom'?'自定义':opt+'MB'}}</label>
            <input v-if="adminUploadFileSizeMode==='custom'" type="number" id="customFileSize" v-model.number="adminUploadCustomSize" min="1" step="1" class="admin-number-small" aria-label="自定义文件大小 MB" />
          </div>
          <div id="fileSizePreview" class="admin-muted" aria-live="polite">{{adminUploadFileSizePreview}}</div>
        </fieldset>
        <fieldset class="admin-setting-fieldset">
          <legend>上传截止时间</legend>
          <div class="admin-settings-actions">
            <label class="admin-radio-option"><input type="radio" name="deadlineMode" value="none" v-model="adminUploadDeadlineMode">不限制</label>
            <label class="admin-radio-option"><input type="radio" name="deadlineMode" value="duration" v-model="adminUploadDeadlineMode">按时长</label>
            <label class="admin-radio-option"><input type="radio" name="deadlineMode" value="date" v-model="adminUploadDeadlineMode">按日期时间</label>
          </div>
          <div v-if="adminUploadDeadlineMode==='duration'" id="durationInputs" class="admin-settings-actions">
            <label>时 <input type="number" id="deadlineHours" v-model.number="adminUploadHours" min="0" step="1" class="admin-number-small"></label>
            <label>分 <input type="number" id="deadlineMinutes" v-model.number="adminUploadMinutes" min="0" max="59" step="1" class="admin-number-small"></label>
            <label>秒 <input type="number" id="deadlineSeconds" v-model.number="adminUploadSeconds" min="0" max="59" step="1" class="admin-number-small"></label>
          </div>
          <div v-if="adminUploadDeadlineMode==='date'" id="dateInput">
            <input type="datetime-local" id="deadlineDate" v-model="adminUploadDate" class="form-control" aria-label="截止日期时间" />
          </div>
          <div id="deadlinePreview" class="admin-muted" aria-live="polite">{{adminUploadDeadlinePreview}}</div>
        </fieldset>
        <button class="btn btn-primary" :disabled="adminUploadSaving" @click="invokePageAction('saveFileUploadSettings', $event.currentTarget)">{{adminUploadSaving?'保存中…':'保存文件上传设置'}}</button>
        <div v-if="adminUploadSaveResult" id="fileUploadSaveResult" class="admin-vue-result" :class="adminUploadSaveError?'admin-result-error':''" role="status">{{adminUploadSaveResult}}</div>
      </div>

      <div class="card">
        <h2>上传要求弹窗</h2>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;">
          <label style="font-weight:500;">弹窗状态：</label>
          <button id="toggleRequirementBtn" class="btn" :class="adminRequirementEnabled?'btn-danger':'btn-success'" @click="adminRequirementEnabled=!adminRequirementEnabled">{{adminRequirementEnabled?'关闭':'开启'}}</button>
          <span id="requirementStatus" class="admin-setting-status" :class="adminRequirementEnabled?'state-on':'state-off'">当前：{{adminRequirementEnabled?'开启':'关闭'}}</span>
        </div>
        <div class="form-group">
          <label>弹窗内容（学生每次打开上传页面时显示）</label>
          <textarea class="form-control" id="requirementMessage" v-model="adminRequirementMessage" rows="5"></textarea>
        </div>
        <button class="btn btn-primary" @click="invokePageAction('saveRequirementSettings', $event.currentTarget)">保存弹窗设置</button>
        <div v-if="adminRequirementResult" id="requirementSaveResult" class="admin-vue-result" role="status">{{adminRequirementResult}}</div>
      </div>

      <div class="card">
        <h2>主页公告</h2>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;">
          <label style="font-weight:500;">公告状态：</label>
          <button id="toggleAnnouncementBtn" class="btn" :class="adminAnnouncementEnabled?'btn-danger':'btn-success'" @click="adminAnnouncementEnabled=!adminAnnouncementEnabled">{{adminAnnouncementEnabled?'关闭':'开启'}}</button>
          <span id="announcementStatus" class="admin-setting-status" :class="adminAnnouncementEnabled?'state-on':'state-off'">当前：{{adminAnnouncementEnabled?'开启':'关闭'}}</span>
        </div>
        <div class="form-group">
          <label>公告标题</label>
          <input type="text" class="form-control" id="announcementTitle" v-model="adminAnnouncementTitle" placeholder="系统公告" />
        </div>
        <div class="form-group">
          <label>公告内容（进入主页时弹窗显示）</label>
          <textarea class="form-control" id="announcementMessage" v-model="adminAnnouncementMessage" rows="5"></textarea>
        </div>
        <button class="btn btn-primary" @click="invokePageAction('saveAnnouncementSettings', $event.currentTarget)">保存公告设置</button>
        <div v-if="adminAnnouncementResult" id="announcementSaveResult" class="admin-vue-result" role="status">{{adminAnnouncementResult}}</div>
      </div>

      <div class="card">
        <h2>清空系统数据</h2>
        <p style="color:#e53e3e;font-weight:600;">警告：此操作将永久删除所有申请数据和学生数据，且不可恢复！</p>
        <button class="btn btn-danger" @click="invokePageAction('clearData', $event.currentTarget)" style="margin-top:12px;">确认清空数据</button>
      </div>
    </div>

    <!-- 文件管理 -->
    <div id="tab-files" class="tab-content" :class="{active:activeTab==='files'}">
      <div class="card">
        <h2>已上传文件</h2>
        <div style="margin-bottom:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
          <button class="btn btn-primary" @click="refreshPageAction('loadUploads', $event.currentTarget)">刷新</button>
          <button class="btn btn-success" :disabled="adminProgress.busy" @click="invokePageAction('downloadAllZip', $event.currentTarget)">打包下载全部</button>
          <button class="btn btn-warning" @click="invokePageAction('openSubmissionModal')">提交状态</button>
          <span class="refresh-indicator" id="fileRefreshIndicator" style="display:none;"><span class="dot"></span>实时刷新中</span>
        </div>
        <div class="uploaded-files-scroll" role="region" aria-label="已上传文件列表" tabindex="0">
          <table class="uploaded-files-table">
            <thead><tr><th>姓名</th><th>学号</th><th>文件名</th><th>上传时间</th><th>操作</th></tr></thead>
            <tbody id="uploadTableBody">
              <tr v-if="fileLoading ? fileRows.length===0 : false"><td colspan="5" class="empty-state">正在读取上传文件…</td></tr>
              <tr v-else-if="fileError"><td colspan="5" class="empty-state" role="alert">{{fileError}}</td></tr>
              <tr v-for="(r,i) in fileRows" :key="r.id+'-'+i">
                <td>{{r.name || ''}}</td><td>{{r.studentId || ''}}</td>
                <td><a class="file-link uploaded-file-name" :href="r.url" target="_blank" rel="noopener">{{r.displayName}}</a></td>
                <td>{{r.displayTime}}</td>
                <td class="uploaded-file-action-cell"><div class="uploaded-file-actions">
                    <a class="btn btn-primary btn-small uploaded-file-action" :href="r.url" download>下载</a>
                    <button type="button" class="btn btn-danger btn-small uploaded-file-action" :disabled="fileActionBusy" @click="invokePageAction('deleteUpload', $event.currentTarget, r.id)">删除记录</button>
                </div></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div id="uploadEmpty" v-if="fileRows.length===0 ? !fileLoading ? !fileError : false : false" class="empty-state">暂无上传记录</div>
      </div>
    </div>

    <!-- 系统维护 -->
    <div id="tab-maintenance" class="tab-content" :class="{active:activeTab==='maintenance'}">
      <div class="card">
        <h2>冗余数据扫描与清理</h2>
        <p style="color:#6b7280;font-size:14px;margin-bottom:16px;">
          冗余数据是指除了<strong>待发放学分（approved）</strong>、<strong>需要修改学分（needs_fix）</strong>、<strong>待审核学分（pending）</strong>之外的所有学分活动数据。
        </p>
        <div style="margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-primary" @click="invokePageAction('scanRedundantData', $event.currentTarget)">扫描冗余数据</button>
          <button class="btn btn-danger" @click="invokePageAction('cleanRedundantData', $event.currentTarget)">清理全部冗余数据</button>
        </div>
        <div v-if="adminMaintenanceScan" class="stat-grid" id="maintenanceStats">
          <div class="stat-card"><div class="stat-label">总活动数量</div><div class="stat-value" id="statTotalCount">{{adminMaintenanceScan?.totalCount||0}}</div></div>
          <div class="stat-card"><div class="stat-label">有效活动数量</div><div class="stat-value" id="statValidCount">{{Math.max(0,(adminMaintenanceScan?.totalCount||0)-(adminMaintenanceScan?.count||0))}}</div></div>
          <div class="stat-card warning"><div class="stat-label">冗余活动数量</div><div class="stat-value" id="statRedundantCount">{{adminMaintenanceScan?.count||0}}</div></div>
          <div class="stat-card warning"><div class="stat-label">冗余数据占用</div><div class="stat-value" id="statRedundantSize">{{((adminMaintenanceScan?.sizeBytes||0)/1024).toFixed(2)}}<span class="stat-unit">KB</span></div></div>
        </div>
        <div v-if="adminMaintenanceScan" id="redundantListWrap" class="maintenance-results">
          <h3 style="font-size:16px;font-weight:600;margin-bottom:12px;color:#2a3b5e;">冗余活动列表</h3>
          <div style="overflow-x:auto;">
            <table>
              <thead><tr><th>姓名</th><th>学号</th><th>活动名称</th><th>状态</th><th>创建时间</th></tr></thead>
              <tbody id="redundantTableBody"><tr v-for="(record,i) in adminMaintenanceScan.apps||[]" :key="record.id||i">
                  <td>{{record.name||'未知'}}</td><td>{{record.packageName||''}}</td><td>{{record.versionName||''}}</td>
                  <td><span class="badge badge-danger">{{record.status||'未知'}}</span></td><td>{{adminFormatTime(record.createdAt)}}</td>
                </tr></tbody>
            </table>
          </div>
          <div v-if="!(adminMaintenanceScan.apps||[]).length" id="redundantEmpty" class="empty-state">没有冗余数据</div>
        </div>
      </div>
    </div>

    <!-- Legacy deep links remain functional. Settings are now managed centrally. -->
    <section id="tab-about" class="tab-content" :class="{active:activeTab==='about'}">
      <div class="card"><h2>系统信息设置已迁移</h2><p>关于页面信息现在统一在「设置」中维护。</p><a class="btn btn-primary" href="/settings.html?view=admin#about-system">前往设置 →</a></div>
    </section>

    <!-- 登录日志 -->
    <div id="tab-logs" class="tab-content" :class="{active:activeTab==='logs'}">
      <div class="card">
        <h2>登录日志（最近1000条）</h2>
        <div class="log-table-wrap">
          <table>
            <thead><tr><th>用户名</th><th>时间</th><th>IP</th><th>User-Agent</th></tr></thead>
            <tbody id="logTableBody">
              <tr v-if="adminLogsLoading"><td colspan="4" class="empty-state">正在读取登录日志…</td></tr>
              <tr v-else-if="adminLogsError"><td colspan="4" class="empty-state" role="alert">{{adminLogsError}}</td></tr>
              <tr v-for="(log,i) in adminLogs" :key="i"><td>{{log.username}}</td><td>{{adminFormatTime(log.time)}}</td><td>{{log.ip||'未知'}}</td><td class="log-agent">{{log.userAgent||'未知'}}</td></tr>
            </tbody>
          </table>
        </div>
        <div v-if="adminLogsEmpty" id="logEmpty" class="empty-state">暂无登录记录</div>
        <button class="btn btn-primary" @click="refreshPageAction('loadLogs', $event.currentTarget)" style="margin-top:12px;">刷新</button>
      </div>
    </div>
  </div>

  <!-- 真实操作进度。处理中没有取消/关闭按钮；完成或失败后可关闭。 -->
  <div v-if="adminProgress.open" class="admin-progress-overlay" role="presentation">
    <div class="admin-progress-dialog" role="dialog" aria-modal="true" aria-labelledby="adminProgressTitle" aria-describedby="adminProgressDetail" tabindex="-1">
      <div v-if="adminProgress.busy ? adminProgress.scope==='zip' : false">
        <div class="admin-progress-icon"><span class="admin-progress-spinner" aria-hidden="true"></span></div>
        <h2 id="adminProgressTitle">正在打包文件…</h2>
        <p id="adminProgressDetail" class="admin-progress-detail">请稍候，正在依次获取文件并生成 ZIP</p>
        <div class="admin-progress-track" role="progressbar" :aria-valuenow="adminProgress.percent" aria-valuemin="0" aria-valuemax="100"><div class="admin-progress-fill" :style="{width:adminProgress.percent+'%'}"></div></div>
        <div class="admin-progress-percent">{{adminProgress.percent}}%</div>
      </div>
      <div v-else>
      <div class="admin-progress-icon" :class="adminProgress.outcome">
        <span v-if="adminProgress.busy" class="admin-progress-spinner" aria-hidden="true"></span>
        <span v-else-if="adminProgress.outcome==='success'" aria-hidden="true">✓</span>
        <span v-else aria-hidden="true">!</span>
      </div>
      <h2 id="adminProgressTitle">{{adminProgress.title}}</h2>
      <p id="adminProgressDetail" class="admin-progress-detail" role="status" aria-live="polite">{{adminProgress.detail}}</p>
      <div v-if="adminProgress.busy || adminProgress.outcome==='success'" class="admin-progress-track" role="progressbar" :aria-valuenow="adminProgress.indeterminate ? undefined : adminProgress.percent" aria-valuemin="0" aria-valuemax="100" :aria-label="adminProgress.title">
        <div class="admin-progress-fill" :class="{'is-indeterminate':adminProgress.indeterminate}" :style="adminProgress.indeterminate ? {} : {width:adminProgress.percent+'%'}"></div>
      </div>
      <div v-if="adminProgress.busy ? !adminProgress.indeterminate : adminProgress.outcome==='success'" class="admin-progress-percent">{{adminProgress.percent}}%</div>
      <p v-if="adminProgress.busy" class="admin-progress-warning">正在处理，请勿重复操作或关闭页面</p>
      <button v-else type="button" class="btn btn-primary admin-progress-close" @click="closeAdminProgress()">关闭</button>
      </div>
    </div>
  </div>

  <!-- 提交状态弹窗 -->
  <div v-if="adminSubmissionOpen" class="modal-overlay show" id="submissionModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2>提交状态</h2>
        <button class="modal-close" @click="invokePageAction('closeSubmissionModal')">×</button>
      </div>
      <div class="modal-tabs">
        <button id="tabSubmittedBtn" class="submission-tab" :class="{active:adminSubmissionTab==='submitted'}" @click="invokePageAction('switchSubmissionTab', 'submitted')">已交 ({{adminSubmissionRows.submitted.length}})</button>
        <button id="tabNotSubmittedBtn" class="submission-tab" :class="{active:adminSubmissionTab==='notSubmitted'}" @click="invokePageAction('switchSubmissionTab', 'notSubmitted')">未交 ({{adminSubmissionRows.notSubmitted.length}})</button>
      </div>
      <div class="modal-body">
        <div class="modal-toolbar">
          <button class="btn btn-primary btn-small" :disabled="adminExcelExportBusy || !adminSubmissionReady || !adminSubmissionVisible.length" @click="invokePageAction('exportSubmissionExcel', $event.currentTarget)">{{adminExcelExportBusy?'正在导出…':'导出 Excel'}}</button>
          <button class="btn btn-outline btn-small" @click="refreshPageAction('refreshSubmissionData', $event.currentTarget)">刷新</button>
          <span class="submission-sync-label" id="submissionSyncState" role="status" aria-live="polite">{{adminExcelExportResult || adminSubmissionStatus}}</span>
        </div>
        <div style="overflow-x:auto;">
          <table>
            <thead id="submissionThead"><tr v-if="adminSubmissionTab==='submitted'"><th>姓名</th><th>学号</th><th>提交次数</th><th>文件数</th><th>最近提交</th></tr>
              <tr v-else><th>姓名</th><th>学号</th></tr></thead>
            <tbody id="submissionTbody">
              <tr v-if="!adminSubmissionReady"><td :colspan="adminSubmissionTab==='submitted'?5:2" class="empty-state">正在加载学生及上传记录，请稍候…</td></tr>
              <tr v-else v-for="(row,i) in adminSubmissionVisible" :key="row.studentId+'-'+i">
                <td>{{row.name}}</td><td>{{row.studentId}}</td>
                <template v-if="adminSubmissionTab==='submitted'"><td>{{row.count}}</td><td>{{row.fileCount}}</td><td>{{adminFormatTime(row.lastTime)}}</td></template>
              </tr>
            </tbody>
          </table>
        </div>
        <div v-if="adminSubmissionReady && !adminSubmissionVisible.length" id="submissionEmpty" class="empty-state">暂无数据</div>
        <div class="submission-last-update" id="submissionUpdatedAt" aria-live="polite">{{adminSubmissionUpdatedAt ? '列表快照：'+adminFormatTime(adminSubmissionUpdatedAt) : ''}}</div>
      </div>
    </div>
  </div>

  
</template>
  <noscript>请开启 JavaScript 以使用学分申请系统。</noscript>
</body>
</html>
