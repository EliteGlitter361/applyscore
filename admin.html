<!doctype html>
<html lang="zh-CN" data-page="admin">
<head>
  <meta charset="utf-8"/>
  <script src="/assets/theme.js?v=3.6.3"></script>
  <style id="credit-critical-paint">html{background:#f4f7fc;color-scheme:light}html[data-theme="dark"]{background:#101927;color-scheme:dark}html[data-theme="dark"] body,html[data-theme="dark"] #app{background:#101927!important;color:#e9f2ff!important}html[data-theme="dark"] #music-root{background:#101927!important;color:#e9f2ff!important}html[data-theme="light"] body{background:#f4f7fc}</style>
  <script src="/assets/music-bootstrap.js?v=3.9.109"></script>
  <script src="/assets/route-guard.js?v=3.9.112"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#f5f8fc"/>
  <meta name="description" content="学分申请系统：学分申报、进度查询、文件上传与审核管理"/>
  <title>系统管理 | 学分申请系统</title>
  <link rel="icon" href="/assets/icons/网页选项卡标题，网站logo.webp" type="image/webp">
  <link rel="modulepreload" href="/assets/controllers/admin.mjs?v=3.9.122">
  <link rel="stylesheet" href="/assets/pages/admin.css?v=3.9.96"/>
  <link rel="stylesheet" href="/assets/core.css?v=3.9.113">
  <script defer src="/vendor/vue.global.js"></script>
  <script defer src="/api-cache.js?v=3.9.45"></script>
  <script defer src="/sync.js?v=3.9.45"></script>
  <script defer src="/feedback.js?v=2.9"></script>
  <script defer src="/assets/vue-feedback.js?v=3.9.45"></script><script defer src="/custom-dialog.js?v=3.9.99"></script>
  <script defer src="/assets/refresh-feedback.js?v=2.2"></script>
  <script defer src="/assets/assigned-proof.js?v=3.9.45"></script>
  <script defer src="/assets/app.js?v=3.9.125"></script>
<link rel="stylesheet" href="/assets/pages/management-responsive.css?v=3.9.96"><link rel="stylesheet" href="/assets/activity-cards.css?v=3.9.45"><link rel="stylesheet" href="/assets/audit-window.css?v=3.9.124"><meta name="application-version" content="3.9.45"><link rel="stylesheet" href="/assets/security-center.css?v=3.9.115"><link rel="stylesheet" href="/assets/announcement-themes.css?v=3.9.80"></head>
<body class="page-admin">


  <div id="app"></div>
  <template id="page-template">


  <div class="navbar">
    <h1>系统管理 <small>System</small></h1>
  </div>
  <div class="container">
    <div class="admin-tab-switcher">
      <label class="admin-mobile-tab-select">管理功能
        <select v-model="activeTab" @change="changeTab(activeTab)" aria-label="选择系统管理选项卡">
          <option value="admins">管理员管理</option>
          <option value="students">学生管理</option>
          <option v-if="adminTabPermissions['messages']" value="messages">消息发送</option>
          <option value="tools">工具</option>
          <option v-if="adminTabPermissions['files']" value="files">文件任务管理</option>
          <option v-if="adminTabPermissions['requests']" value="requests">指定申请</option><option v-if="adminTabPermissions['request-activities']" value="request-activities">指定申请活动管理</option><option value="maintenance">系统安全</option>
          <option value="logs">登录日志</option>
          
        </select>
      </label>
    <div class="tabs-wrap">
      <div class="tabs" role="tablist">
        <button class="tab-btn" :class="{active:activeTab==='admins'}" @click="changeTab('admins')" data-tab="admins" role="tab">管理员管理</button>
        <button class="tab-btn" :class="{active:activeTab==='students'}" @click="changeTab('students')" data-tab="students" role="tab">学生管理</button>
        <button class="tab-btn" v-if="adminTabPermissions['messages']" :class="{active:adminTabPermissions['messages'] && activeTab==='messages'}" @click="changeTab('messages')" data-tab="messages" role="tab">消息发送</button>
        <button class="tab-btn" :class="{active:activeTab==='tools'}" @click="changeTab('tools')" data-tab="tools" role="tab">工具</button>
        <button class="tab-btn" v-if="adminTabPermissions['files']" :class="{active:adminTabPermissions['files'] && activeTab==='files'}" @click="changeTab('files')" data-tab="files" role="tab">文件任务管理</button>
        <button class="tab-btn" v-if="adminTabPermissions['requests']" :class="{active:adminTabPermissions['requests'] && activeTab==='requests'}" @click="changeTab('requests')" data-tab="requests" role="tab">指定申请</button><button type="button" class="tab-btn" v-if="adminTabPermissions['request-activities']" :class="{active:adminTabPermissions['request-activities'] && activeTab==='request-activities'}" @click="changeTab('request-activities')">指定申请活动管理</button><button class="tab-btn" :class="{active:activeTab==='maintenance'}" @click="changeTab('maintenance')" data-tab="maintenance" role="tab">系统安全</button>
        <button class="tab-btn" :class="{active:activeTab==='logs'}" @click="changeTab('logs')" data-tab="logs" role="tab">登录日志</button>
        
      </div>
    </div>

    </div>

    <!-- 管理员管理 -->
    <div id="tab-admins" class="tab-content" :class="{active:activeTab==='admins'}">
      <div class="card">
        <h2>管理员列表</h2>
        <div id="adminTable" aria-live="polite">
          <div v-if="adminListError" class="empty-state" role="alert">{{adminListError}}</div>
          <div v-else-if="adminRows === null"><div class="skeleton-table-row"></div><div class="skeleton-table-row"></div></div>
          <div v-else-if="adminRows.length === 0" class="empty-state">暂无管理员</div>
          <div v-else class="admin-account-views"><div class="admin-accounts-wrap"><table class="vue-admin-table" :class="{'admin-table-summary':!currentAdminAccess?.canManagePermissions}">
            <thead><tr><th>ID</th><th>用户名</th><th>角色</th><template v-if="currentAdminAccess?.canManagePermissions"><th>审核权限</th><th>封禁权限</th><th>指定申请权限</th><th>消息发送权限</th><th>文件查看权限</th><th>账户授权</th><th>操作</th></template></tr></thead>
            <tbody>
              <tr v-for="u in adminRows" :key="u.id || u.username">
                <td data-label="ID">{{u.id}}</td><td data-label="用户名"><strong>{{u.username}}</strong><small v-if="u.isCurrent" class="admin-current-marker">当前账户</small></td><td data-label="角色"><span class="admin-role-label">{{u.isInitialSystem?'初始化 system':u.role}}</span></td>
                <template v-if="currentAdminAccess?.canManagePermissions">
                <td v-for="permission in adminPermissionDefinitions" :key="permission.key" :data-label="permission.label">
                  <button type="button" class="toggle-btn" :class="{active:!!u[permission.key]}" :disabled="!u.canEditPermissions" @click="toggleAdminAccountPermission(u,permission.key)">{{u[permission.key]?'开启':'关闭'}}</button>
                </td>
                <td data-label="账户授权">
                  <div v-if="u.canDelegate" class="admin-delegation-controls">
                    <button type="button" class="admin-grant" :aria-pressed="u.canCreateAccounts" @click="toggleToolPermission(u,'canCreateAccounts')">创建账户 <span>{{u.canCreateAccounts?'允许':'禁止'}}</span></button>
                    <button type="button" class="admin-grant" :aria-pressed="u.canManagePermissions" @click="toggleToolPermission(u,'canManagePermissions')">设置其他账户权限 <span>{{u.canManagePermissions?'允许':'禁止'}}</span></button>
                    <button type="button" class="admin-grant" :aria-pressed="u.canManageRiskRules" @click="toggleToolPermission(u,'canManageRiskRules')">风控设置 <span>{{u.canManageRiskRules?'显示':'隐藏'}}</span></button>
                  </div>
                  <span v-else class="admin-current-marker">{{u.isInitialSystem?'内置权限':'—'}}</span>
                </td>
                <td data-label="操作">
                  <button v-if="currentAdminAccess?.isInitialSystem" type="button" class="btn btn-outline btn-small" @click="editWelcomeName('admin',u)">设置称呼</button><button v-if="u.canDelete" class="btn btn-danger btn-small" @click="invokePageAction('deleteAdmin', $event.currentTarget, u.username)">删除</button>
                </td>
                </template>
              </tr>
            </tbody>
          </table></div><div class="admin-account-cards"><article v-for="u in adminRows" :key="u.id||u.username" class="admin-account-card"><header><img :src="u.role==='system'?'/assets/icons/system账户头像.png':'/assets/icons/admin账户头像.webp'" alt=""><div><h3>{{u.username}}</h3><p>{{u.role}} · ID {{u.id}}</p></div></header><div v-if="currentAdminAccess?.canManagePermissions" class="admin-permission-grid"><div v-for="permission in adminPermissionDefinitions" :key="permission.key" class="admin-permission-item"><span>{{permission.label}}</span><button type="button" class="toggle-btn" :class="{active:!!u[permission.key]}" :disabled="!u.canEditPermissions" @click="toggleAdminAccountPermission(u,permission.key)">{{u[permission.key]?'开启':'关闭'}}</button></div></div><div v-if="u.canDelegate" class="admin-delegation-controls">
      <button type="button" class="admin-grant" :aria-pressed="u.canCreateAccounts" @click="toggleToolPermission(u,'canCreateAccounts')">创建账户 <span>{{u.canCreateAccounts?'允许':'禁止'}}</span></button>
      <button type="button" class="admin-grant" :aria-pressed="u.canManagePermissions" @click="toggleToolPermission(u,'canManagePermissions')">设置其他账户权限 <span>{{u.canManagePermissions?'允许':'禁止'}}</span></button>
      <button type="button" class="admin-grant" :aria-pressed="u.canManageRiskRules" @click="toggleToolPermission(u,'canManageRiskRules')">风控设置 <span>{{u.canManageRiskRules?'显示':'隐藏'}}</span></button>
    </div><footer v-if="currentAdminAccess?.isInitialSystem || u.canDelete"><button v-if="currentAdminAccess?.isInitialSystem" type="button" class="btn btn-outline btn-small" @click="editWelcomeName('admin',u)">设置称呼</button><button v-if="u.canDelete" type="button" class="btn btn-danger"  @click="invokePageAction('deleteAdmin',$event.currentTarget,u.username)">删除账户</button></footer><p v-else-if="u.isInitialSystem" class="admin-system-hint">初始化 system 账户</p></article></div></div>
        </div>
      </div>
      <div v-if="adminRows?.some(u=>u.isCurrent && u.canCreateAccounts)" class="card">
        <h2>创建管理员</h2>
        <div class="row">
          <div class="form-group"><label>用户名</label><input class="form-control" id="newUsername" placeholder="用户名" /></div>
          <div class="form-group"><label>密码（至少8位）</label><input class="form-control" id="newPassword" type="password" placeholder="密码" /></div>
        </div>
        <div class="form-group"><label>角色</label>
          <select class="form-control" id="newRole">
            <option value="admin">Admin</option>
            <option value="system">System</option>
          </select>
        </div>
        <button class="btn btn-primary" @click="invokePageAction('createAdmin', $event.currentTarget)">创建管理员</button>
      </div>
    </div>

    <!-- 学生管理 -->
    <div id="tab-students" class="tab-content" :class="{active:activeTab==='students'}">
      <div class="card">
        <h2>学生名单</h2>
        <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px;">
          <button class="btn btn-danger" @click="invokePageAction('deleteSelectedStudents', $event.currentTarget)" :disabled="adminStudentsSelectedCount===0 || adminStudentsLoading">删除选中</button>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
            <input type="checkbox" id="selectAllStudents" :checked="adminStudentsAllSelected" @change="adminSelectAllStudents($event.target.checked)"> 全选
          </label>
          <span style="color:#718096;font-size:14px;">已选 <strong id="selectedCount">{{adminStudentsSelectedCount}}</strong> 人</span>
        </div>
        <div style="overflow-x:auto;">
          <table>
            <thead><tr>
              <th><input type="checkbox" class="checkbox" id="selectAllTable" :checked="adminStudentsAllSelected" @change="adminSelectAllStudents($event.target.checked)"></th>
              <th>姓名</th>
              <th>学号</th>
              <th>密码</th>
              <th>状态</th>
              <th>封禁解除倒计时</th>
              <th>操作</th>
            </tr></thead>
            <tbody id="studentTableBody">
              <tr v-if="adminStudentsLoading"><td colspan="7" class="empty-state">正在加载学生名单…</td></tr>
              <tr v-else-if="adminStudentsError"><td colspan="7" class="empty-state" role="alert">{{adminStudentsError}}</td></tr>
              <tr v-for="s in adminStudentsRows" :key="String(s.studentId)">
                <td><input type="checkbox" class="checkbox student-checkbox" :value="String(s.studentId)" :checked="!!adminStudentSelected[String(s.studentId)]" @change="adminSelectStudent(s.studentId,$event.target.checked)"></td>
                <td>{{s.name}}</td><td>{{s.studentId}}</td>
                <td><span v-if="s.hasPassword">已设置</span><span v-else class="text-muted">未设置</span></td>
                <td><span class="badge" :class="studentIsBanned(s)?'badge-danger':'badge-success'">{{studentIsBanned(s)?'已封禁':'正常'}}</span></td>
                <td><span :class="{'account-ban-countdown':studentIsBanned(s)}">{{studentIsBanned(s)?accountBanCountdown(s):'—'}}</span></td>
                <td><div class="admin-student-actions">
                  <button v-if="currentAdminAccess?.isInitialSystem" type="button" class="btn btn-outline btn-small" @click="editWelcomeName('student',s)">设置称呼</button>
                  <button class="btn btn-warning btn-small" @click="invokePageAction('resetStudentPassword',$event.currentTarget,s.studentId)">重置密码</button>
                  <button v-if="currentAdminAccess?.canBan" :disabled="studentIsBanned(s) && !s.canUnban" class="btn btn-warning btn-small" @click="invokePageAction('toggleBanStudent',$event.currentTarget,s.studentId,studentIsBanned(s))">{{studentIsBanned(s)?'解封':'封禁'}}</button>
                </div></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div id="studentEmpty" v-if="adminStudentsEmpty" class="empty-state">暂无学生数据</div>
      </div>

      <div class="card" v-show="currentAdminAccess?.canCreateAccounts">
        <h2>手动添加学生</h2>
        <div class="row">
          <div class="form-group"><label>姓名</label><input class="form-control" id="newStudentName" placeholder="姓名" /></div>
          <div class="form-group"><label>学号</label><input class="form-control" id="newStudentId" placeholder="学号" /></div>
        </div>
        <div class="form-group"><label>登录密码（可留空，学生将无法登录）</label><input class="form-control" id="newStudentPassword" placeholder="为学生设置登录密码" /></div>
        <button class="btn btn-primary" @click="invokePageAction('addStudent', $event.currentTarget)">添加</button>
      </div>

      <div class="card" v-show="currentAdminAccess?.canCreateAccounts">
        <h2>批量导入（xls / xlsx）</h2>
        <p style="color:#6b7280;font-size:14px;margin-bottom:8px;">文件需包含列：<strong>姓名</strong> 和 <strong>学号</strong>，可选 <strong>密码</strong> 列</p>
        <div class="admin-settings-actions">
          <input type="file" id="fileInput" accept=".xls,.xlsx" :disabled="adminImportBusy" @change="adminImportPickFile($event)" aria-label="选择学生 Excel 文件" />
          <button class="btn btn-success" :disabled="adminImportBusy || !adminImportFile" @click="invokePageAction('importStudents', $event.currentTarget)">{{adminImportBusy?'正在导入…':'导入'}}</button>
        </div>
        <p v-if="adminImportFile" class="admin-muted">已选择：{{adminImportFile.name}}</p>
        <div v-if="adminImportResult" id="importResult" class="admin-vue-result" role="status">{{adminImportResult}}</div>
        <div v-if="adminImportVisible" id="importProgress" class="import-progress admin-vue-import-progress" role="progressbar" :aria-valuenow="adminImportPercent" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar"><div class="progress-fill" :style="{width:adminImportPercent+'%'}"></div></div>
          <div class="progress-text">{{adminImportPercent}}%（{{adminImportDone}}/{{adminImportTotal}}）</div>
        </div>
        <details v-if="adminImportFailures.length" class="admin-muted"><summary>查看失败记录（{{adminImportFailures.length}} 条）</summary><div v-for="(message,index) in adminImportFailures" :key="index">{{message}}</div></details>
      </div>
    </div>

    <!-- 消息发送 -->
    <div id="tab-messages" class="tab-content" :class="{active:adminTabPermissions['messages'] && activeTab==='messages'}">
      <div class="card">
        <header class="message-compose-heading"><h2>向学生发送消息</h2><button type="button" class="btn btn-outline" @click="openMessageHistory">查看历史消息</button></header>
        <div class="form-group">
          <label>选择接收学生（可多选）</label>
          <div style="margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-outline btn-small" @click="adminSelectAllMessageStudents(true)">全选</button>
            <button class="btn btn-outline btn-small" @click="adminSelectAllMessageStudents(false)">清空选择</button>
            <span class="student-selection-count">已选 <strong id="msgSelectedCount">{{adminMessageSelectedCount}}</strong> 人</span>
          </div>
          <div class="student-select-list" id="msgStudentList" aria-live="polite">
            <div v-if="adminMessageStudentsLoading" class="empty-state">正在加载接收学生…</div>
            <div v-else-if="adminMessageStudentsError" class="empty-state" role="alert">{{adminMessageStudentsError}}</div>
            <div v-else-if="!adminMessageStudents.length" class="empty-state">暂无学生</div>
            <label v-for="s in adminMessageStudents" :key="String(s.studentId)" class="student-option">
              <input type="checkbox" :value="String(s.studentId)" :checked="!!adminMessageSelected[String(s.studentId)]" @change="adminToggleMessageStudent(s.studentId,$event.target.checked)">
              <span class="student-name">{{s.name}}</span><span class="student-id">{{s.studentId}}</span>
            </label>
          </div>
        </div>
        <div class="form-group">
          <label>消息标题</label>
          <input class="form-control" id="msgTitle" placeholder="请输入消息标题" />
        </div>
        <div class="form-group">
          <label>消息内容</label>
          <textarea class="form-control" id="msgContent" rows="5" placeholder="请输入消息内容..."></textarea>
        </div>
        <button class="btn btn-primary" :disabled="adminProgress.busy" @click="invokePageAction('sendCustomMessage', $event.currentTarget)">发送消息</button>
        <div v-if="adminMessageResult" id="msgSendResult" class="admin-vue-result" role="status">{{adminMessageResult}}</div>
      </div>
    </div>

    <!-- 工具 -->
    <div id="tab-tools" class="tab-content" :class="{active:activeTab==='tools'}">
      <div class="card">
        <h2>修改其他账户密码</h2>
        <div class="row">
          <div class="form-group"><label>用户名</label><input class="form-control" id="changePwdUsername" placeholder="用户名" /></div>
          <div class="form-group"><label>新密码（至少8位）</label><input class="form-control" id="changePwdNewPwd" type="password" placeholder="新密码" /></div>
        </div>
        <button class="btn btn-warning" @click="invokePageAction('changePassword', $event.currentTarget)">修改密码</button>
      </div>

      <div class="card">
        <h2>学分申请入口开关</h2>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;">
          <label style="font-weight:500;">申请入口状态：</label>
          <button id="toggleEntryBtn" class="btn" :class="adminEntryEnabled?'btn-danger':'btn-success'" @click="adminEntryEnabled=!adminEntryEnabled">{{adminEntryEnabled?'关闭':'开启'}}</button>
          <span id="entryStatus" class="admin-setting-status" :class="adminEntryEnabled?'state-on':'state-off'">当前：{{adminEntryEnabled?'开启':'关闭'}}</span>
        </div>
        <div class="form-group">
          <label>自定义提示文字（当入口关闭时显示）</label>
          <textarea class="form-control" id="entryMessage" v-model="adminEntryMessage" rows="3"></textarea>
        </div>
        <div class="admin-settings-actions">
          <span id="entry-return-label">关闭学分入口时显示「返回学分总览」</span>
          <button type="button" class="file-entrance-switch" role="switch" aria-labelledby="entry-return-label" :aria-checked="adminEntryClosedShowReturn" :class="{'is-on':adminEntryClosedShowReturn}" @click="adminEntryClosedShowReturn=!adminEntryClosedShowReturn"><span class="file-entrance-thumb"></span></button>
          <span class="file-entrance-state">{{adminEntryClosedShowReturn?'显示':'隐藏'}}</span>
        </div>
        <div class="inline-schedule-settings">
        <fieldset v-for="kind in ['open','close']" :key="kind" class="admin-setting-fieldset">
          <legend>{{kind==='open'?'定时开启':'定时关闭'}}</legend>
          <div class="admin-settings-actions"><label v-for="option in [{value:'none',label:'不设置'},{value:'duration',label:'按时长'},{value:'date',label:'按日期时间'},{value:'daily',label:'每天指定时间'}]" :key="option.value" class="admin-radio-option"><input type="radio" :name="'enabled-'+kind" :value="option.value" v-model="scheduleForms.enabled[kind].mode" @change="scheduleForms.enabled[kind].at=''">{{option.label}}</label></div>
          <div v-if="scheduleForms.enabled[kind].mode==='duration'" class="admin-settings-actions"><label>时 <input type="number" v-model.number="scheduleForms.enabled[kind].hours" min="0" class="admin-number-small"></label><label>分 <input type="number" v-model.number="scheduleForms.enabled[kind].minutes" min="0" max="59" class="admin-number-small"></label></div>
          <input v-if="['date','daily'].includes(scheduleForms.enabled[kind].mode)" :type="scheduleForms.enabled[kind].mode==='daily'?'time':'datetime-local'" v-model="scheduleForms.enabled[kind].at" class="form-control" :aria-label="kind==='open'?'定时开启时间':'定时关闭时间'">
          <p class="admin-muted">{{scheduleForms.enabled[kind].mode==='none'?'不设置定时操作':'北京时间；随下方设置一起保存'}}</p>
        </fieldset><p v-if="scheduleError" role="alert">{{scheduleError}}</p></div>
        <button class="btn btn-primary" @click="invokePageAction('saveEntrySettings', $event.currentTarget)">保存设置</button>
        <div v-if="adminEntryResult" id="entrySaveResult" class="admin-vue-result" role="status">{{adminEntryResult}}</div>
      </div>

      <section class="card" aria-labelledby="systemShutdownHeading">
        <h2 id="systemShutdownHeading">系统全部关闭时间</h2>
        <p class="admin-muted">到时关闭学生服务并在首页显示停服公告，管理员仍可登录。</p>
        <fieldset class="admin-setting-fieldset">
          <legend>设置方式</legend>
          <div class="admin-settings-actions">
            <label v-for="option in [{value:'none',label:'不设置'},{value:'duration',label:'按时长'},{value:'date',label:'按日期时间'}]" :key="option.value" class="admin-radio-option"><input type="radio" name="system-shutdown-mode" :value="option.value" v-model="adminSystemShutdownMode">{{option.label}}</label>
          </div>
          <div v-if="adminSystemShutdownMode==='duration'" class="admin-settings-actions">
            <label>小时 <input type="number" v-model.number="adminSystemShutdownHours" min="0" step="1" class="admin-number-small"></label>
            <label>分钟 <input type="number" v-model.number="adminSystemShutdownMinutes" min="0" max="59" step="1" class="admin-number-small"></label>
            <span class="admin-muted">从保存时开始计时</span>
          </div>
          <div v-if="adminSystemShutdownMode==='date'" class="form-group">

kbox" role="switch" v-model="requestAttachmentRequired"></label><fieldset class="request-expiry"><legend>申请有效期</legend><label><input type="radio" value="none" v-model="requestExpiryMode">不限制</label><label><input type="radio" value="date" v-model="requestExpiryMode">指定截止时间</label><label><input type="radio" value="duration" v-model="requestExpiryMode">按有效天数</label></fieldset><div v-if="requestExpiryMode==='date'" class="form-group"><label for="request-expiry">截止时间</label><input id="request-expiry" type="datetime-local" class="form-control" v-model="requestExpiresAt" required></div><div v-if="requestExpiryMode==='duration'" class="form-group"><label for="request-duration">有效天数</label><input id="request-duration" type="number" min="1" max="3650" class="form-control" v-model.number="requestDurationDays" required></div><div class="request-preview"><strong>{{requestTitle||'尚未填写活动名称'}}</strong><p>发送给 {{requestSelectedCount}} 位学生</p><p>{{requestAttachmentRequired?'附件必填':'附件选填'}} · {{requestExpiryMode==='none'?'长期有效':requestExpiryMode==='date'?(requestExpiresAt||'请选择截止时间'):requestDurationDays+' 天内有效'}}</p></div></aside></div><footer class="request-compose-footer"><p v-if="requestNotice" role="status">{{requestNotice}}</p><span v-else>发送后，学生可在“管理员发放的申请”中填写提交。</span><button type="submit" class="btn btn-primary" :class="{'request-submit-busy':requestBusy}" :disabled="requestBusy">{{requestBusy?'正在发送…':'发送给 '+requestSelectedCount+' 位学生'}}</button></footer></form></section><section class="tab-content request-workspace" :class="{active:adminTabPermissions['request-activities'] && activeTab==='request-activities'}" id="tab-request-activities"><div class="card"><h2>指定申请活动管理</h2><div class="request-actions"><label><input type="checkbox" :checked="assignedRequests.length>0 && assignedRequests.every(t=>requestActivitySelected[t.id])" @change="requestActivitySelected=Object.fromEntries(assignedRequests.map(t=>[t.id,$event.target.checked]))"> 全选活动</label><button type="button" class="btn btn-danger" :disabled="requestListBusy || !Object.values(requestActivitySelected).some(Boolean)" @click="deleteAssignedActivities">删除选中（{{Object.values(requestActivitySelected).filter(Boolean).length}}）</button></div><button class="btn btn-outline btn-small" @click="apiCacheRefreshRequests" :disabled="requestListBusy">{{requestListBusy?'正在刷新…':'刷新'}}</button><div class="app-grid"><article v-for="t in assignedRequests" :key="t.id" class="activity-card-choice"><label class="activity-card-select"><input type="checkbox" v-model="requestActivitySelected[t.id]" :aria-label="'选择活动：'+t.title"><span class="visually-hidden">选择活动</span></label><button type="button" class="app-card assigned-credit-card" @click="requestDetailId=t.id"><div class="app-title">{{t.title}}</div><div class="app-student">{{t.description || '点击查看申请详情与提交材料'}}</div><div class="app-meta"><span class="tag time">{{t.createdAt?adminFormatTime(t.createdAt):'长期有效'}}</span><span class="tag assigned-credit-tag">指定申请</span><span class="tag">{{(t.submissions||[]).length}} / {{(t.studentIds||[]).length}} 已提交</span></div></button></article><p v-if="!assignedRequests.length" class="empty-state">暂无已发送申请</p></div></div>
<div v-if="requestDetail" class="request-overlay" @click.self="requestDetailId=null"><section class="request-detail" role="dialog" aria-modal="true" aria-label="指定申请详情" @keydown.esc="requestDetailId=null"><button type="button" class="request-window-close" aria-label="关闭指定申请详情" @click="requestDetailId=null">×</button><h2>{{requestDetail.title}}</h2><p class="request-description">{{requestDetail.description}}</p><p>指定 {{(requestDetail.studentIds||[]).length}} 人 · 已提交 {{(requestDetail.submissions||[]).length}} 人</p><p>截止：{{requestDetail.expiresAt?adminFormatTime(requestDetail.expiresAt):'长期有效'}} · {{requestDetail.attachmentRequired?'必须上传附件':'附件选填'}}</p><p>指定学号：{{(requestDetail.studentIds||[]).join('、')}}</p><article class="request-submission" v-for="sub in requestDetail.submissions||[]" :key="sub.studentId"><div class="request-stats"><h3>{{sub.name}} · {{sub.studentId}}</h3><span class="tag">{{sub.status==='approved'?'已通过':sub.status==='needs_fix'?'需要修改':'待审核'}}</span></div><h4>{{sub.activityName}}</h4><p>参与名单：{{sub.participants||'未填写'}}</p><p>活动地点：{{sub.location}} · 时间：{{sub.activityTime}}</p><p>提交时间：{{adminFormatTime(sub.submittedAt)}}</p><p v-if="sub.rejectReason">修改原因：{{sub.rejectReason}}</p><h4>证明材料（图片）</h4><div class="assigned-proof-grid"><div class="img-wrapper" v-for="file in (sub.files||[]).filter(f=>f.kind?.startsWith('image'))" :key="file.name"><credit-assigned-proof :task-id="requestDetail.id" :student-id="sub.studentId" :file="file" @preview="dashboardPreviewSrc=$event"></credit-assigned-proof></div></div><h4>申请附件</h4><div class="request-files"><button class="btn btn-outline" v-for="file in (sub.files||[]).filter(f=>f.kind?.startsWith('attachment'))" :key="file.name" @click="downloadAssigned(requestDetail,sub,file)">下载 {{file.originalName||file.name}}</button><p v-if="!(sub.files||[]).some(f=>f.kind?.startsWith('attachment'))">无附件</p></div></article><p v-if="!(requestDetail.submissions||[]).length" class="empty-state">学生尚未提交材料</p></section></div></section>

<form v-if="currentAdminAccess?.canManageRiskRules && accountRiskRules" class="admin-setting-fieldset" @submit.prevent="saveAccountRiskRules">
  <h3>账户风控自动封禁</h3>
  <p class="admin-muted">设备按浏览器标识识别，累计设备数规则可设置 1 至 168 小时的统计窗口。提交频率按单个账户合并计算，包含普通申请、指定申请和文件上传的提交请求。</p>
  <fieldset class="account-risk-fields" :disabled="accountRiskSaving">
    <div class="admin-settings-actions">
      <span id="admin-risk-scope-label">规则作用域扩展到admin账户</span>
      <button type="button" class="file-entrance-switch" role="switch" aria-labelledby="admin-risk-scope-label" :aria-checked="accountRiskRules.includeAdmin" :class="{'is-on':accountRiskRules.includeAdmin}" @click="accountRiskRules.includeAdmin=!accountRiskRules.includeAdmin"><span class="file-entrance-thumb"></span></button>
      <small class="admin-muted">system 账户不参与风控。提交、撤回和修改规则始终只检查学生。</small>
    </div>
    <div v-for="rule in [{id:'submission',label:'一分钟内提交超限',limitLabel:'最多提交次数',min:1,max:120},{id:'loginFailures',label:'输错密码后登录',limitLabel:'输错次数',min:1,max:20},{id:'loginFrequency',label:'一分钟内登录超限',limitLabel:'最多登录次数',min:1,max:120},{id:'deviceCount',label:'累计登录设备数限制',limitLabel:'不同设备数',min:2,max:20},{id:'applicationWithdrawals',label:'十分钟内撤回申请超限',limitLabel:'最多撤回次数',min:1,max:120},{id:'applicationRevisions',label:'十分钟内修改重交超限',limitLabel:'最多重交次数',min:1,max:120}]" :key="rule.id" class="admin-settings-actions">
      <label><input type="checkbox" v-model="accountRiskRules[rule.id].enabled"> {{rule.label}}</label>
      <label v-if="rule.limitLabel">{{rule.limitLabel}} <input type="number" class="admin-number-small" :min="rule.min" :max="rule.max" step="1" required v-model.number="accountRiskRules[rule.id].limit"></label>
      <label v-if="rule.id==='deviceCount'">最近 <input type="number" class="admin-number-small" min="1" max="168" step="1" required v-model.number="accountRiskRules[rule.id].windowHours"> 小时</label>
      <label>封禁天数 <input type="number" class="admin-number-small" min="1" max="365" step="1" required v-model.number="accountRiskRules[rule.id].days"></label>
      <p v-if="rule.id==='submission'" class="admin-muted account-risk-example">按学生账号合并计算最近 60 秒的普通申请、指定申请、修改重交和文件上传请求。达到上限后，下一次请求触发封禁，校验失败的提交请求也计入。</p>
      <p v-if="rule.id==='applicationWithdrawals'" class="admin-muted account-risk-example">统计学生撤回「需要修改」的普通申请和指定申请的次数。</p>
      <p v-if="rule.id==='applicationRevisions'" class="admin-muted account-risk-example">统计学生修改并重新提交被驳回的普通申请和指定申请的次数，首次提交不计入。</p>
      <p v-if="rule.id==='loginFailures'" class="admin-muted account-risk-example">同一浏览器 15 分钟内输错密码达到阈值后，再用正确密码登录时触发。单纯输错密码不会封禁账户。</p>
      <p v-if="rule.id==='loginFrequency'" class="admin-muted account-risk-example">滚动 1 分钟内成功登录已达到上限时，再次登录会触发。</p>
      <p v-if="rule.id==='deviceCount'" class="admin-muted account-risk-example">最近 {{accountRiskRules.deviceCount.windowHours}} 小时内累计登录 {{accountRiskRules.deviceCount.limit}} 个不同设备就会触发，本次登录计入总数，同一设备重复登录只计一次。</p>
    </div>
  </fieldset>
  <button type="submit" class="btn btn-primary" :disabled="accountRiskSaving">保存风控规则</button>
</form>

        </fieldset>
        <fieldset class="admin-setting-fieldset">
          <legend>上传截止时间</legend>
          <div class="admin-settings-actions">
            <label class="admin-radio-option"><input type="radio" name="deadlineMode" value="none" v-model="adminUploadDeadlineMode">不限制</label>
            <label class="admin-radio-option"><input type="radio" name="deadlineMode" value="duration" v-model="adminUploadDeadlineMode">按时长</label>
            <label class="admin-radio-option"><input type="radio" name="deadlineMode" value="date" v-model="adminUploadDeadlineMode">按日期时间</label>
          </div>
          <div v-if="adminUploadDeadlineMode==='duration'" id="durationInputs" class="admin-settings-actions">
            <label>时 <input type="number" id="deadlineHours" v-model.number="adminUploadHours" min="0" step="1" class="admin-number-small"></label>
            <label>分 <input type="number" id="deadlineMinutes" v-model.number="adminUploadMinutes" min="0" max="59" step="1" class="admin-number-small"></label>
            <label>秒 <input type="number" id="deadlineSeconds" v-model.number="adminUploadSeconds" min="0" max="59" step="1" class="admin-number-small"></label>
          </div>
          <div v-if="adminUploadDeadlineMode==='date'" id="dateInput">
            <input type="datetime-local" id="deadlineDate" v-model="adminUploadDate" class="form-control" aria-label="截止日期时间" />
          </div>
          <div id="deadlinePreview" class="admin-muted" aria-live="polite">{{adminUploadDeadlinePreview}}</div>
        </fieldset>
        <button class="btn btn-primary" :disabled="adminUploadSaving" @click="invokePageAction('saveFileUploadSettings', $event.currentTarget)">{{adminUploadSaving?'保存中…':(fileTaskId?'保存任务设置':'发布上传任务')}}</button>
        <div v-if="adminUploadSaveResult" id="fileUploadSaveResult" class="admin-vue-result" :class="adminUploadSaveError?'admin-result-error':''" role="status">{{adminUploadSaveResult}}</div>
  </section>
</div>
<div v-if="accountRiskDetail" class="audit-modal-overlay show" @click.self="accountRiskDetail=null" @keydown.esc="accountRiskDetail=null">
<section class="audit-modal-card" role="dialog" aria-modal="true" aria-labelledby="account-device-title">
<header class="audit-modal-header"><h2 id="account-device-title">{{accountRiskDetail.name}}的近期登录设备</h2><button class="audit-modal-close" type="button" ref="accountDevicesClose" aria-label="关闭" @click="accountRiskDetail=null">×</button></header>
<p>最近 24 小时内有记录的浏览器设备。</p>
<ul class="account-device-history"><li v-for="(device,index) in accountRiskDetail.risk.recentDevices" :key="index"><strong>{{device.name}}</strong><span>{{adminFormatTime(device.seenAt)}}</span></li></ul>
</section></div>

<dialog ref="messageHistoryDialog" class="audit-modal-card tools-file-dialog message-history-dialog" aria-labelledby="message-history-title">
  <header class="audit-modal-header">
    <h2 id="message-history-title">管理员发送历史</h2>
    <button type="button" class="audit-modal-close" aria-label="关闭" @click="$refs.messageHistoryDialog.close()">×</button>
  </header>
  <div class="message-history-toolbar">
    <label class="message-history-filter">
      <span>发送管理员</span>
      <select class="form-control" v-model="messageHistoryFilter" :disabled="messageHistoryLoading">
        <option value="">全部</option>
        <option v-for="sender in messageHistorySenders" :key="sender" :value="sender">{{sender || '发送人未知（旧记录）'}}</option>
      </select>
    </label>
    <button type="button" class="btn btn-outline" :disabled="messageHistoryLoading" @click="loadMessageHistory">{{messageHistoryLoading?'正在刷新…':'刷新'}}</button>
  </div>
  <p v-if="messageHistoryLoading" class="empty-state" role="status">正在加载历史消息…</p>
  <div v-else-if="messageHistoryError" class="empty-state" role="alert">
    <p>{{messageHistoryError}}</p>
    <button type="button" class="btn btn-outline" @click="loadMessageHistory">重新加载</button>
  </div>
  <p v-else-if="!messageHistoryFiltered.length" class="empty-state">{{messageHistoryFilter === '' ? '暂无管理员发送记录。审核结果、指定申请和文件任务等自动通知在学生站内消息中查看。' : '该发送人暂无匹配记录'}}</p>
  <div v-else class="message-history-list">
    <article v-for="row in messageHistoryFiltered" :key="row.id" class="message-history-entry">
      <h3>{{row.title}}</h3>
      <p class="message-history-meta"><span>{{row.sentBy || '发送人未知（旧记录）'}}</span><span>{{formatMessageHistoryTime(row.createdAt)}}</span><span>{{row.recipientCount}} 位接收学生</span></p>
      <p class="message-history-content">{{row.content}}</p>
      <details class="message-history-recipients">
        <summary>已读 {{row.readCount}} 人 · 未读 {{row.unreadCount}} 人<span v-if="row.recipientCount > row.readCount + row.unreadCount"> · 状态未知 {{row.recipientCount - row.readCount - row.unreadCount}} 人</span></summary>
        <ul>
          <li v-for="(recipient, index) in row.recipients" :key="index">
            <span>{{recipient.name ? recipient.name + ' · ' : ''}}{{recipient.studentId}}</span>
            <strong>{{recipient.read === null ? '状态未知' : recipient.read ? '已读' : '未读'}}</strong>
          </li>
        </ul>
      </details>
    </article>
  </div>
</dialog>
</template>
  <noscript>请开启 JavaScript 以使用学分申请系统。</noscript>
</body>
</html>
