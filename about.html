<!doctype html>
<html lang="zh-CN" data-page="about">
<head>
  <meta charset="utf-8"/>
  <script src="/assets/theme.js?v=3.4.1"></script>
  <style id="credit-critical-paint">html{background:#f4f7fc;color-scheme:light}html[data-theme="dark"]{background:#101927;color-scheme:dark}html[data-theme="dark"] body,html[data-theme="dark"] #app{background:#101927!important;color:#e9f2ff!important}html[data-theme="dark"] #music-root{background:#101927!important;color:#e9f2ff!important}html[data-theme="light"] body{background:#f4f7fc}</style>
  <script src="/assets/music-bootstrap.js?v=2.4"></script>
  <script src="/assets/route-guard.js?v=2.2"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#f5f8fc"/>
  <meta name="description" content="学分申请系统：学分申报、进度查询、文件上传与审核管理"/>
  <title>关于 | 学分申请系统</title>
  <link rel="icon" href="/assets/icons/网页选项卡标题，网站logo.webp" type="image/webp">
  <link rel="stylesheet" href="/assets/pages/about.css?v=3.4.1"/>
  <link rel="stylesheet" href="/assets/core.css?v=3.4.4">
  <script defer src="/vendor/vue.global.js"></script>
  <script defer src="/api-cache.js"></script>
  <script defer src="/sync.js"></script>
  <script defer src="/feedback.js?v=2.9"></script>
  <script defer src="/assets/vue-feedback.js?v=2.9"></script><script defer src="/custom-dialog.js?v=2.9"></script>
  <script defer src="/assets/refresh-feedback.js?v=2.2"></script>
  <script defer src="/assets/app.js?v=3.4.3"></script>
</head>
<body class="page-about">
  <div id="app"><div class="first-paint" aria-live="polite"><span class="first-paint-logo"><img src="/assets/icons/网页选项卡标题，网站logo.webp" alt="学分服务中心"></span><span>正在打开学分服务中心</span><span class="first-paint-bar"></span></div></div>
  <template id="page-template">
  <div class="about-public-wrap">
    <div class="about-public-heading"><span class="about-pill">ABOUT · 系统介绍</span><h1>关于</h1><p>了解学分申请系统与服务信息</p></div>
    <section class="about-public-card" aria-live="polite">
      <div v-if="aboutStatus==='loading'" class="about-public-loading" role="status"><span class="about-spinner"></span>正在获取系统信息…</div>
      <div v-else-if="aboutStatus==='error'" class="about-public-loading" role="alert"><p>{{aboutError}}</p><button class="about-retry" @click="loadAboutInfo()">重新加载</button></div>
      <template v-else>
        <div class="about-brand-glyph"><img src="/assets/icons/网页选项卡标题，网站logo.webp" alt="学分服务中心 Logo" width="65" height="65" decoding="async"></div>
        <p class="about-kicker">CREDIT SERVICE CENTER</p>
        <h2>{{aboutInfo.title}}</h2>
        <p v-if="aboutInfo.subtitle" class="about-subtitle">{{aboutInfo.subtitle}}</p>
        <div class="about-divider"></div>
        <h3>系统简介</h3>
        <p class="about-description">{{aboutInfo.description || '暂无系统介绍。'}}</p>
        <div class="about-metadata">
          <div v-if="aboutInfo.organization"><span>维护单位</span><strong>{{aboutInfo.organization}}</strong></div>
          <div v-if="aboutInfo.version"><span>版本信息</span><strong>v{{aboutInfo.version}}</strong></div>
          <div v-if="aboutInfo.contactEmail"><span>联系邮箱</span><a :href="'mailto:' + aboutInfo.contactEmail">{{aboutInfo.contactEmail}}</a></div>
          <div v-if="aboutInfo.website"><span>相关网站</span><a :href="aboutInfo.website" target="_blank" rel="noopener noreferrer">访问官网 ↗</a></div>
        </div>
        <p v-if="aboutUpdatedAt" class="about-updated">资料更新：{{new Date(aboutUpdatedAt).toLocaleDateString('zh-CN')}}</p>
      </template>
    </section>
  </div>
</template>
  <noscript>请开启 JavaScript 以使用学分申请系统。</noscript>
</body>
</html>
