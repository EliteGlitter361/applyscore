<!doctype html>
<html lang="zh-CN" data-page="dashboard">
<head>
  <meta charset="utf-8"/>
  <script src="/assets/route-guard.js?v=1.8"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#f5f8fc"/>
  <meta name="description" content="学分申请系统：学分申报、进度查询、文件上传与审核管理"/>
  <title>审核工作台 | 学分申请系统</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="/assets/pages/dashboard.css?v=1.8"/>
  <link rel="stylesheet" href="/feedback.css"/>
  <link rel="stylesheet" href="/assets/design.css"/>
  <link rel="stylesheet" href="/assets/mobile-fixes.css?v=1.8"/>
  <link rel="stylesheet" href="/assets/mobile-v15.css?v=1.8"/>
  <script defer src="/vendor/vue.global.js"></script>
  <script defer src="/api-cache.js"></script>
  <script defer src="/sync.js"></script>
  <script defer src="/feedback.js"></script>
  <script defer src="/custom-dialog.js"></script>
  <script defer src="/assets/refresh-feedback.js?v=1.8"></script>
  <script defer src="/assets/app.js?v=1.8"></script>
</head>
<body class="page-dashboard">
  <div id="app"><div class="first-paint" aria-live="polite"><span class="first-paint-logo">学</span><span>正在打开学分服务中心</span><span class="first-paint-bar"></span></div></div>
  <template id="page-template">
  <div class="navbar">
    <h1>审核工作台</h1>
    <div class="nav-actions">
<button v-if="!isSystem" class="btn btn-logout" @click="invokePageAction('logout')">退出登录</button>
    </div>
  </div>

  <div class="permission-bar">
    <span class="label">当前权限：</span>
    <span>审核：<span class="permission-badge" id="auditPermBadge">加载中...</span></span>
    <span v-if="!isSystem">封禁：<span class="permission-badge" id="banPermBadge">加载中...</span></span>
  </div>

  <div class="container">
    <div class="tabs-wrap">
      <div class="tabs" role="tablist">
        <button class="tab-btn active" data-tab="pending" role="tab">待审核</button>
        <button class="tab-btn" data-tab="approved" role="tab">已审核</button>
        <button class="tab-btn" v-if="!isSystem" id="studentTab" data-tab="students" role="tab" style="display:none;">封禁管理</button>
      </div>
    </div>

    <div id="tab-pending" class="tab-content active">
      <div class="app-list">
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
      </div>
    </div>
    <div id="tab-approved" class="tab-content"></div>
    <div id="tab-students" class="tab-content"></div>
  </div>

  <div class="audit-modal-overlay" id="auditModalOverlay">
    <div class="audit-modal-card" id="auditModalCard"></div>
  </div>

  
</template>
  <noscript>请开启 JavaScript 以使用学分申请系统。</noscript>
</body>
</html>
