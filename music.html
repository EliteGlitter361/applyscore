<!doctype html><html lang="zh-CN" data-page="music"><head><meta charset="utf-8"><script src="/assets/theme.js?v=3.4.1"></script>
  <style id="credit-critical-paint">html{background:#f4f7fc;color-scheme:light}html[data-theme="dark"]{background:#101927;color-scheme:dark}html[data-theme="dark"] body,html[data-theme="dark"] #app{background:#101927!important;color:#e9f2ff!important}html[data-theme="dark"] #music-root{background:#101927!important;color:#e9f2ff!important}html[data-theme="light"] body{background:#f4f7fc}</style><script src="/assets/music-bootstrap.js?v=2.4"></script><script src="/assets/route-guard.js?v=3.4.5"></script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f8fc"><title>网页 NBS 音乐盒 · 系统管理</title><link rel="icon" href="/assets/icons/网页选项卡标题，网站logo.webp" type="image/webp"><link rel="stylesheet" href="/assets/pages/music.css?v=3.4.4">
  <link rel="stylesheet" href="/assets/core.css?v=3.4.4">
  <script defer src="/vendor/vue.global.js"></script><script defer src="/api-cache.js?v=3.4.6"></script><script defer src="/sync.js"></script><script defer src="/feedback.js?v=2.9"></script><script defer src="/assets/vue-feedback.js?v=2.9"></script><script defer src="/custom-dialog.js?v=2.9"></script><script defer src="/assets/app.js?v=3.4.5"></script></head><body class="page-music"><div id="app"><div class="first-paint" aria-live="polite"><span class="first-paint-logo"><img src="/assets/icons/网页选项卡标题，网站logo.webp" alt="学分服务中心"></span><span>正在打开 NBS 音乐盒…</span><span class="first-paint-bar"></span></div></div>
<template id="page-template"><div class="music-manager"><div class="music-manager-head"><img src="/assets/icons/音乐盒.webp" alt="Minecraft 音符盒"><div><h1>网页 NBS 音乐盒</h1><p>system 管理员可导入或删除 MP3 音频。曲目保存到 Gitee，普通用户可通过音乐盒设置收听。</p></div></div><section class="music-manager-card"><div class="music-manager-toolbar"><b>音乐库 · {{musicTracks.length}} 首</b><div class="music-manager-actions"><button type="button" class="music-import-button" :disabled="musicBusy" @click="$refs.musicPicker.click()">＋ 导入 MP3 文件</button><input ref="musicPicker" class="music-file-picker" type="file" accept=".mp3,audio/mpeg" multiple @change="importMusicFiles" hidden><button type="button" class="music-secondary-btn" @click="loadMusicTracks" :disabled="musicBusy">刷新</button><button type="button" class="music-danger-btn" @click="deleteMusicSelected" :disabled="musicBusy || !selectedMusicCount" :aria-disabled="musicBusy || !selectedMusicCount">删除选中 ({{selectedMusicCount}})</button></div></div><div class="music-select-row"><label><input type="checkbox" :checked="musicTracks.length ? selectedMusicCount===musicTracks.length : false" @change="selectAllMusic($event.target.checked)"> 全选</label><span>每个 MP3 最多 12 MB · 一次可选多个文件</span></div><p v-if="musicError" class="music-alert" role="alert">{{musicError}}</p><p v-if="musicLoading" class="music-manager-loading">正在加载音乐库…</p><div v-else-if="!musicTracks.length" class="music-manager-empty">还没有音频，点击上方“导入 MP3 文件”按钮创建音乐库。</div><div v-else class="music-manager-list"><div v-for="track in musicTracks" :key="track.id" class="music-manager-track"><input type="checkbox" :checked="!!musicSelected[track.id]" @change="setMusicSelected(track.id,$event.target.checked)" :aria-label="'选中 '+track.name"><img src="/assets/icons/音乐盒.webp" alt=""><div class="music-manager-track-info"><b :title="track.name">{{track.name}}</b><small>{{(track.size/1024/1024).toFixed(2)}} MB</small></div><div class="music-manager-track-actions"><button type="button" class="music-secondary-btn" @click="playMusicTrack(track.id)">播放</button><button type="button" class="music-danger-btn" @click="deleteMusicOne(track.id)" :disabled="musicBusy">删除</button></div></div></div></section><div v-if="musicDeleteAsk" class="music-delete-overlay" role="presentation"><section class="music-delete-dialog" role="alertdialog" aria-modal="true" aria-labelledby="musicDeleteTitle" aria-describedby="musicDeleteDescription"><h2 id="musicDeleteTitle">删除选中的曲目？</h2><p id="musicDeleteDescription">即将从音乐库永久删除 {{musicDeletePending.length}} 首 MP3，操作不可撤销。</p><div class="music-delete-actions"><button type="button" @click="cancelMusicDelete">取消</button><button type="button" class="music-delete-confirm" @click="confirmMusicDelete">确认删除</button></div></section></div><div v-if="musicBusy" class="music-task-shade"><div class="music-task-dialog" role="dialog" aria-modal="true"><div class="music-task-spinner"></div><b>{{musicActionLabel}}</b><div class="music-task-bar"><div :style="{width:musicPercent+'%'}"></div></div><strong>{{musicPercent}}%</strong></div></div></div></template><noscript>请启用 JavaScript</noscript></body></html>
