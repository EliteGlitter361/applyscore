  <link rel="stylesheet" href="/assets/pages/index.css?v=1.8"/>
  <link rel="stylesheet" href="/feedback.css"/>

  <template id="page-template">

  <div class="container">
    <div class="page-header"><h1>学分总览</h1>
      <div class="nav-actions" id="navActions" aria-label="账户操作"></div></div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="搜索姓名、学号或活动名称...">
      <button class="refresh-btn" id="refreshBtn">刷新</button>
    </div>

    <div class="tabs-wrap">
      <div class="tabs" role="tablist">
        <button class="tab-btn active" data-tab="pending" role="tab">待发放的学分</button>
        <button class="tab-btn" data-tab="needs-fix" role="tab">需要修改的学分</button>
      </div>
    </div>

    <div id="tab-pending" class="tab-content active">
      <div class="app-grid" id="appGridPending">
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
    </div>

    <div id="tab-needs-fix" class="tab-content">
      <div class="app-grid" id="appGridFix"></div>
    </div>
  </div>

  <div class="message-toast-container" id="messageToastContainer"></div>

  
</template>
