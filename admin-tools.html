<!doctype html>
<html lang="zh-CN" data-page="admin-tools">
<head>
  <meta charset="utf-8"/>
  <script src="/assets/theme.js?v=3.6.0"></script>
  <style id="credit-critical-paint">html{background:#f4f7fc;color-scheme:light}html[data-theme="dark"]{background:#101927;color-scheme:dark}html[data-theme="dark"] body,html[data-theme="dark"] #app{background:#101927!important;color:#e9f2ff!important}html[data-theme="dark"] #music-root{background:#101927!important;color:#e9f2ff!important}html[data-theme="light"] body{background:#f4f7fc}</style>
  <script src="/assets/music-bootstrap.js?v=2.4"></script>
  <script src="/assets/route-guard.js?v=3.9.45"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#f5f8fc"/>
  <meta name="description" content="学分申请系统：学分申报、进度查询、文件上传与审核管理"/>
  <title>管理工具 | 学分申请系统</title>
  <link rel="icon" href="/assets/icons/网页选项卡标题，网站logo.webp" type="image/webp">
  <link rel="modulepreload" href="/assets/controllers/admin-tools.mjs?v=3.9.45">
  <link rel="stylesheet" href="/assets/pages/admin-tools.css?v=3.9.45"/>
  <link rel="stylesheet" href="/assets/pages/assigned-compose.css?v=3.9.45">
  <link rel="stylesheet" href="/assets/core.css?v=3.9.45">
  <script defer src="/vendor/vue.global.js"></script>
  <script defer src="/api-cache.js?v=3.9.45"></script>
  <script defer src="/sync.js?v=3.9.45"></script>
  <script defer src="/feedback.js?v=2.9"></script>
  <script defer src="/assets/vue-feedback.js?v=3.9.45"></script><script defer src="/custom-dialog.js?v=2.9"></script>
  <script defer src="/assets/refresh-feedback.js?v=2.2"></script>
  
  <script defer src="/assets/app.js?v=3.9.56"></script>
<link rel="stylesheet" href="/assets/activity-cards.css?v=3.9.45"><meta name="application-version" content="3.9.45"><link rel="stylesheet" href="/assets/security-center.css?v=3.9.45"></head>
<body class="page-admin-tools">


  <div id="app"></div>
  <template id="page-template"><div class="container"><header class="page-header tools-heading"><div class="tools-title"><img src="/assets/icons/command-block.gif" alt=""><div><h1>管理工具</h1><p>选择工具，集中处理日常事务。</p></div></div><button type="button" class="btn btn-outline" :disabled="tool.refreshing||tool.busy" @click="toolApi.refresh()"><span :class="{'tools-spinning':tool.refreshing}">↻</span> {{tool.refreshing?'正在刷新…':'刷新工具'}}</button></header><p v-if="tool.error" class="dashboard-alert" role="alert">{{tool.error}}</p><p v-if="tool.loading" role="status">正在加载管理工具…</p><div v-else><div v-if="tool.panel" class="tabs-wrap tools-tabs"><div class="tabs"><button type="button" class="tab-btn" v-if="tool.permissions.assignedPermission" :class="{active:tool.panel==='compose'}" @click="tool.panel='compose'"><img src="/assets/icons/提交申请.webp" alt="">指定申请</button><button type="button" class="tab-btn" v-if="tool.permissions.messagePermission" :class="{active:tool.panel==='messages'}" @click="tool.panel='messages'"><img src="/assets/icons/我的消息.png" alt="">消息发送</button><button type="button" class="tab-btn" v-if="tool.permissions.filePermission" :class="{active:tool.panel==='files'}" @click="tool.panel='files';toolApi.loadFiles()"><img src="/assets/icons/文件上传.webp" alt="">文件管理</button><button type="button" class="tab-btn" v-if="tool.permissions.canBan" :class="{active:tool.panel==='bans'}" @click="tool.panel='bans';toolApi.loadBans(true)"><img src="/assets/icons/学生登录.webp" alt="">学生封禁</button></div></div><section v-if="tool.panel==='bans' && tool.permissions.canBan" class="card request-compose"><h2>学生封禁</h2><input class="form-control" v-model.trim="tool.search" placeholder="搜索姓名或学号"><article class="request-submission tools-student-row" v-for="s in toolBanFiltered" :key="s.studentId"><div><strong>{{s.name}}</strong><p>{{s.studentId}} · {{s.banned?'已封禁':'正常'}}</p></div><button type="button" class="btn" :class="s.banned?'btn-success':'btn-danger'" :disabled="tool.busy" @click="toolApi.toggleBan(s)">{{s.banned?'解封':'封禁'}}</button></article><p v-if="!toolBanFiltered.length" class="empty-state">暂无匹配学生</p></section><section v-if="tool.panel==='compose' && tool.permissions.assignedPermission" class="request-workspace"><form class="card request-compose" @submit.prevent="createAssignedRequest"><header class="request-compose-heading"><div><div class="request-eyebrow">指定申请 · 创建任务</div><h2>发送学分申请</h2><p>填写活动信息，选择接收学生，设置材料要求与提交时间。</p></div></header><div class="request-compose-grid"><section class="request-compose-main"><div class="request-step"><span>01</span><h3>活动信息</h3></div><div class="form-group"><label for="request-title">活动名称 *</label><input id="request-title" class="form-control" v-model.trim="requestTitle" required maxlength="120" placeholder="例如：志愿服务实践活动"></div><div class="form-group"><label for="request-description">申请说明</label><textarea id="request-description" class="form-control" v-model.trim="requestDescription" rows="4" placeholder="请说明活动内容、填写要求及证明材料要求"></textarea></div><div class="request-step"><span>02</span><h3>选择接收学生</h3><span class="request-selected-count">已选 {{requestSelectedCount}} 人</span></div><div class="request-picker-toolbar"><input class="form-control" type="search" v-model.trim="requestStudentSearch" placeholder="搜索姓名或学号" aria-label="搜索接收学生"><button type="button" class="btn btn-outline" @click="requestSelectAll">全选 / 取消全部</button></div><div class="request-student-list"><label v-for="s in requestStudentsFiltered" :key="String(s.studentId)" class="request-student-option"><input type="checkbox" :checked="!!requestStudentSelected[String(s.studentId)]" @change="requestToggleStudent(s.studentId,$event.target.checked)"><span>{{s.name}}<small>{{s.studentId}}</small></span></label><p v-if="!requestStudentsFiltered.length" class="empty-state">暂无匹配学生</p></div></section><aside class="request-compose-side"><div class="request-step"><span>03</span><h3>提交规则</h3></div><label class="request-switch"><span><strong>必须上传附件</strong><small>活动证明图片始终为必填</small></span><input type="checkbox" role="switch" v-model="requestAttachmentRequired"></label><fieldset class="request-expiry"><legend>申请有效期</legend><label><input type="radio" value="none" v-model="requestExpiryMode">不限制</label><label><input type="radio" value="date" v-model="requestExpiryMode">指定截止时间</label><label><input type="radio" value="duration" v-model="requestExpiryMode">按有效天数</label></fieldset><div v-if="requestExpiryMode==='date'" class="form-group"><label for="request-expiry">截止时间</label><input id="request-expiry" type="datetime-local" class="form-control" v-model="requestExpiresAt" required></div><div v-if="requestExpiryMode==='duration'" class="form-group"><label for="request-duration">有效天数</label><input id="request-duration" type="number" min="1" max="3650" class="form-control" v-model.number="requestDurationDays" required></div><div class="request-preview"><strong>{{requestTitle||'尚未填写活动名称'}}</strong><p>发送给 {{requestSelectedCount}} 位学生</p><p>{{requestAttachmentRequired?'附件必填':'附件选填'}} · {{requestExpiryMode==='none'?'长期有效':requestExpiryMode==='date'?(requestExpiresAt||'请选择截止时间'):requestDurationDays+' 天内有效'}}</p></div></aside></div><footer class="request-compose-footer"><p v-if="requestNotice" role="status">{{requestNotice}}</p><span v-else>发送后，学生可在“管理员发放的申请”中填写提交。</span><button type="submit" class="btn btn-primary" :class="{'request-submit-busy':requestBusy}" :disabled="requestBusy">{{requestBusy?'正在发送…':'发送给 '+requestSelectedCount+' 位学生'}}</button></footer></form></section><form v-if="tool.panel==='messages' && tool.permissions.messagePermission" class="card request-compose" @submit.prevent="toolApi.sendMessages()"><h2>向学生发送消息</h2><div class="form-group"><label>消息标题</label><input class="form-control" v-model.trim="tool.messageTitle" required maxlength="120"></div><div class="form-group"><label>消息内容</label><textarea class="form-control" v-model.trim="tool.messageContent" required rows="5"></textarea></div><input class="form-control" v-model.trim="requestStudentSearch" placeholder="搜索姓名或学号"><button type="button" class="btn btn-outline" @click="requestSelectAll">全选 / 取消全部</button><div class="request-student-list"><label v-for="s in requestStudentsFiltered" :key="s.studentId"><input type="checkbox" v-model="requestStudentSelected[s.studentId]">{{s.name}} · {{s.studentId}}</label></div><p>已选 {{requestSelectedCount}} 位学生</p><button type="submit" class="btn btn-primary" :disabled="tool.busy">{{tool.busy?'正在发送…':'发送消息'}}</button><p role="status">{{tool.notice}}</p></form><section v-if="tool.panel==='files' && tool.permissions.filePermission" class="card request-compose"><h2>学生上传文件</h2><template v-if="fileManageTask===null"><p v-if="fileTasksLoading" class="empty-state">正在加载文件任务…</p><p v-else-if="fileTaskError" role="alert">{{fileTaskError}} <button class="btn btn-outline" @click="loadFileTasks">重新加载</button></p><p v-else-if="!fileTasks.length" class="empty-state">没有发布的文件任务</p><div v-else class="app-grid"><button v-for="t in fileTasks" :key="t.id" class="app-card" @click="fileTaskOpen(t.id)"><div class="app-title">{{t.title}}</div><div class="app-student">{{t.description || '点击查看任务文件'}}</div><div class="app-meta"><span class="tag time">{{t.createdAt?adminFormatTime(t.createdAt):'文件上传任务'}}</span></div></button></div><button v-if="tool.files.some(r=>!r.taskId)" class="btn btn-outline" @click="fileTaskOpen('legacy')">查看历史上传文件</button></template><button v-else class="btn btn-outline" @click="fileManageTask=null">返回任务列表</button><div class="request-actions"><input class="form-control" v-model.trim="tool.search" placeholder="搜索姓名、学号或文件"><button class="btn btn-outline" :disabled="tool.busy" @click="toolApi.loadFiles(true)">{{tool.busy?'正在刷新…':'刷新'}}</button></div><article v-for="row in toolFilesFiltered.filter(r=>(r.taskId||'legacy')===fileManageTask)" :key="row.id" class="request-submission"><h3>{{row.name}} · {{row.studentId}}</h3><p>{{new Date(row.uploadedAt).toLocaleString('zh-CN')}}</p><div class="request-files"><button type="button" class="btn btn-outline" v-for="file in row.files" :key="file" @click="toolApi.download(row,file)">下载 {{file}}</button></div></article><p v-if="!toolFilesFiltered.length" class="empty-state">暂无匹配文件</p></section><div v-if="!tool.panel" class="tools-empty"><img src="/assets/icons/command-block.gif" alt=""><h2>暂无可用工具</h2><p>可点击“刷新工具”重新读取可用功能。</p></div></div></div></template><noscript>请开启JavaScript。</noscript></body></html>
