<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="result"></pre><script>const sizes=[320,375,390,430,1024,1440];let remaining=sizes.length,failed=false;for(const width of sizes){const f=document.createElement('iframe');f.style.width=width+'px';f.style.height='844px';f.src='management-layout.html';f.onload=()=>setTimeout(()=>{const d=f.contentDocument;const ok=d.body.dataset.result==='PASS';if(!ok)failed=true;document.getElementById('result').textContent+=d.getElementById('result')?.textContent+'\n';if(!--remaining)document.body.dataset.result=failed?'FAIL':'PASS';},100);document.body.appendChild(f);}</script></body></html>
