<!doctype html><html data-theme="light" data-page="admin"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/pages/admin.css"><link rel="stylesheet" href="../assets/pages/settings.css"><link rel="stylesheet" href="../assets/core.css"><link rel="stylesheet" href="../assets/pages/management-responsive.css"><script src="../vendor/vue.global.js"></script><style>body{margin:0}#fixture{width:100%;padding:16px;box-sizing:border-box}#result{display:none}</style></head><body class="page-admin"><div id="fixture" class="page-view"><div id="app"></div></div><template id="page-template">


  <div class="navbar">
    <h1>系统管理 <small>System</small></h1>
  </div>
  <div class="container">
    <div class="admin-tab-switcher">
      <label class="admin-mobile-tab-select">管理功能
        <select v-model="activeTab" @change="changeTab(activeTab)" aria-label="选择系统管理选项卡">
          <option value="admins">管理员管理</option>
          <option value="students">学生管理</option>
          <option value="messages">消息发送</option>
          <option value="tools">工具</option>
          <option value="files">文件任务管理</option>
          <option value="requests">指定申请</option><option value="request-activities">指定申请活动管理</option><option value="maintenance">系统安全</option>
          <option value="logs">登录日志</option>
          <option value="about">（关于）系统信息设置</option>
        </select>
      </label>
    <div class="tabs-wrap">
      <div class="tabs" role="tablist">
        <button class="tab-btn" :class="{active:activeTab==='admins'}" @click="changeTab('admins')" data-tab="admins" role="tab">管理员管理</button>
        <button class="tab-btn" :class="{active:activeTab==='students'}" @click="changeTab('students')" data-tab="students" role="tab">学生管理</button>
        <button class="tab-btn" :class="{active:activeTab==='messages'}" @click="changeTab('messages')" data-tab="messages" role="tab">消息发送</button>
        <button class="tab-btn" :class="{active:activeTab==='tools'}" @click="changeTab('tools')" data-tab="tools" role="tab">工具</button>
        <button class="tab-btn" :class="{active:activeTab==='files'}" @click="changeTab('files')" data-tab="files" role="tab">文件任务管理</button>
        <button class="tab-btn" :class="{active:activeTab==='requests'}" @click="changeTab('requests')" data-tab="requests" role="tab">指定申请</button><button type="button" class="tab-btn" :class="{active:activeTab==='request-activities'}" @click="changeTab('request-activities')">指定申请活动管理</button><button class="tab-btn" :class="{active:activeTab==='maintenance'}" @click="changeTab('maintenance')" data-tab="maintenance" role="tab">系统安全</button>
        <button class="tab-btn" :class="{active:activeTab==='logs'}" @click="changeTab('logs')" data-tab="logs" role="tab">登录日志</button>
        <button class="tab-btn" :class="{active:activeTab==='about'}" @click="changeTab('about')" data-tab="about" role="tab">（关于）系统信息设置</button>
      </div>
    </div>

    </div>

    <!-- 管理员管理 -->
    <div id="tab-admins" class="tab-content" :class="{active:activeTab==='admins'}">
      <div class="card">
        <h2>管理员列表</h2>
        <div id="adminTable" aria-live="polite">
          <div v-if="adminListError" class="empty-state" role="alert">{{adminListError}}</div>
          <div v-else-if="adminRows === null"><div class="skeleton-table-row"></div><div class="skeleton-table-row"></div></div>
          <div v-else-if="adminRows.length === 0" class="empty-state">暂无管理员</div>
          <div v-else class="admin-account-views"><div class="admin-accounts-wrap"><table class="vue-admin-table">
            <thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>审核权限</th><th>封禁权限</th><th>指定申请权限</th><th>消息发送权限</th><th>文件查看权限</th><th>操作</th></tr></thead>
            <tbody>
              <tr v-for="u in adminRows" :key="u.id || u.username">
                <td data-label="ID">{{u.id}}</td><td data-label="用户名">{{u.username}}</td><td data-label="角色">{{u.role}}</td>
                <td data-label="审核权限"><button class="toggle-btn" :class="{active:!!u.auditPermission}" @click="invokePageAction('togglePerm', $event.currentTarget, u.username, !!u.auditPermission)">{{u.auditPermission ? '开启':'关闭'}}</button></td>
                <td data-label="封禁权限"><button class="toggle-btn" :class="{active:!!u.canBan}" @click="invokePageAction('toggleBanPerm', $event.currentTarget, u.username, !!u.canBan)">{{u.canBan ? '允许':'禁止'}}</button></td><td data-label="指定申请权限"><button type="button" class="toggle-btn" :class="{active:!!u.assignedPermission}" :disabled="u.role==='system'||requestBusy" @click="toggleAssignedPermission(u)">{{u.assignedPermission?'开启':'关闭'}}</button></td><td v-for="permission in ['messagePermission','filePermission']" :key="permission" :data-label="permission==='messagePermission'?'消息发送权限':'文件查看权限'"><button type="button" class="toggle-btn" :class="{active:u.role==='system'||!!u[permission]}" :disabled="u.role==='system'||requestBusy" @click="toggleToolPermission(u,permission)">{{u.role==='system'||u[permission]?'开启':'关闭'}}</button></td>
                <td data-label="操作"><button v-if="u.role !== 'system'" class="btn btn-danger btn-small" @click="invokePageAction('deleteAdmin', $event.currentTarget, u.username)">删除</button></td>
              </tr>
            </tbody>
          </table></div><div class="admin-account-cards"><article v-for="u in adminRows" :key="u.id||u.username" class="admin-account-card"><header><img :src="u.role==='system'?'/assets/icons/system账户头像.png':'/assets/icons/admin账户头像.webp'" alt=""><div><h3>{{u.username}}</h3><p>{{u.role}} · ID {{u.id}}</p></div></header><div class="admin-permission-grid"><div v-for="permission in adminPermissionDefinitions" :key="permission.key" class="admin-permission-item"><span>{{permission.label}}</span><button type="button" class="toggle-btn" :class="{active:u.role==='system'||!!u[permission.key]}" :disabled="u.role==='system'||requestBusy" @click="toggleAdminAccountPermission(u,permission.key,$event)">{{u.role==='system'||u[permission.key]?'开启':'关闭'}}</button></div></div><footer v-if="u.role!=='system'"><button type="button" class="btn btn-danger" @click="invokePageAction('deleteAdmin',$event.currentTarget,u.username)">删除账户</button></footer><p v-else class="admin-system-hint">系统账户权限固定开启</p></article></div></div>
        </div>
      </div>
      <div class="card">
        <h2>创建管理员</h2>
        <div class="row">
          <div class="form-group"><label>用户名</label><input class="form-control" id="newUsername" placeholder="用户名" /></div>
          <div class="form-group"><label>密码（至少8位）</label><input class="form-control" id="newPassword" type="password" placeholder="密码" /></div>
        </div>
        <div class="form-group"><label>角色</label>
          <select class="form-control" id="newRole">
            <option value="admin">Admin</option>
            <option value="system">System</option>
          </select>
        </div>
        <button class="btn btn-primary" @click="invokePageAction('createAdmin', $event.currentTarget)">创建管理员</button>
      </div>
    </div>

    <!-- 学生管理 -->
    <div id="tab-students" class="tab-content" :class="{active:activeTab==='students'}">
      <div class="card">
        <h2>学生名单</h2>
        <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px;">
          <button class="btn btn-danger" @click="invokePageAction('deleteSelectedStudents', $event.currentTarget)" :disabled="adminStudentsSelectedCount===0 || adminStudentsLoading">删除选中</button>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
            <input type="checkbox" id="selectAllStudents" :checked="adminStudentsAllSelected" @change="adminSelectAllStudents($event.target.checked)"> 全选
          </label>
          <span style="color:#718096;font-size:14px;">已选 <strong id="selectedCount">{{adminStudentsSelectedCount}}</strong> 人</span>
        </div>
        <div style="overflow-x:auto;">
          <table>
            <thead><tr>
              <th><input type="checkbox" class="checkbox" id="selectAllTable" :checked="adminStudentsAllSelected" @change="adminSelectAllStudents($event.target.checked)"></th>
              <th>姓名</th>
              <th>学号</th>
              <th>密码</th>
              <th>状态</th>
              <th>操作</th>
            </tr></thead>
            <tbody id="studentTableBody">
              <tr v-if="adminStudentsLoading"><td colspan="6" class="empty-state">正在加载学生名单…</td></tr>
              <tr v-else-if="adminStudentsError"><td colspan="6" class="empty-state" role="alert">{{adminStudentsError}}</td></tr>
              <tr v-for="s in adminStudentsRows" :key="String(s.studentId)">
                <td><input type="checkbox" class="checkbox student-checkbox" :value="String(s.studentId)" :checked="!!adminStudentSelected[String(s.studentId)]" @change="adminSelectStudent(s.studentId,$event.target.checked)"></td>
                <td>{{s.name}}</td><td>{{s.studentId}}</td>
                <td><code v-if="s.password" class="pwd-code">{{s.password}}</code><span v-else class="text-muted">未设置</span></td>
                <td><span class="badge" :class="s.banned?'badge-danger':'badge-success'">{{s.banned?'已封禁':'正常'}}</span></td>
                <td><div class="admin-student-actions">
                  <button class="btn btn-warning btn-small" @click="invokePageAction('resetStudentPassword',$event.currentTarget,s.studentId,s.password||'')">重置密码</button>
                  <button class="btn btn-warning btn-small" @click="invokePageAction('toggleBanStudent',$event.currentTarget,s.studentId,!!s.banned)">{{s.banned?'解封':'封禁'}}</button>
                </div></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div id="studentEmpty" v-if="adminStudentsEmpty" class="empty-state">暂无学生数据</div>
      </div>

      <div class="card">
        <h2>手动添加学生</h2>
        <div class="row">
          <div class="form-group"><label>姓名</label><input class="form-control" id="newStudentName" placeholder="姓名" /></div>
          <div class="form-group"><label>学号</label><input class="form-control" id="newStudentId" placeholder="学号" /></div>
        </div>
        <div class="form-group"><label>登录密码（可留空，学生将无法登录）</label><input class="form-control" id="newStudentPassword" placeholder="为学生设置登录密码" /></div>
        <button class="btn btn-primary" @click="invokePageAction('addStudent', $event.currentTarget)">添加</button>
      </div>

      <div class="card">
        <h2>批量导入（xls / xlsx）</h2>
        <p style="color:#6b7280;font-size:14px;margin-bottom:8px;">文件需包含列：<strong>姓名</strong> 和 <strong>学号</strong>，可选 <strong>密码</strong> 列</p>
        <div class="admin-settings-actions">
          <input type="file" id="fileInput" accept=".xls,.xlsx" :disabled="adminImportBusy" @change="adminImportPickFile($event)" aria-label="选择学生 Excel 文件" />
          <button class="btn btn-success" :disabled="adminImportBusy || !adminImportFile" @click="invokePageAction('importStudents', $event.currentTarget)">{{adminImportBusy?'正在导入…':'导入'}}</button>
        </div>
        <p v-if="adminImportFile" class="admin-muted">已选择：{{adminImportFile.name}}</p>
        <div v-if="adminImportResult" id="importResult" class="admin-vue-result" role="status">{{adminImportResult}}</div>
        <div v-if="adminImportVisible" id="importProgress" class="import-progress admin-vue-import-progress" role="progressbar" :aria-valuenow="adminImportPercent" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar"><div class="progress-fill" :style="{width:adminImportPercent+'%'}"></div></div>
          <div class="progress-text">{{adminImportPercent}}%（{{adminImportDone}}/{{adminImportTotal}}）</div>
        </div>
        <details v-if="adminImportFailures.length" class="admin-muted"><summary>查看失败记录（{{adminImportFailures.length}} 条）</summary><div v-for="(message,index) in adminImportFailures" :key="index">{{message}}</div></details>
      </div>
    </div>

    <!-- 消息发送 -->
    <div id="tab-messages" class="tab-content" :class="{active:activeTab==='messages'}">
      <div class="card">
        <h2>向学生发送消息</h2>
        <div class="form-group">
          <label>选择接收学生（可多选）</label>
          <div style="margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-outline btn-small" @click="adminSelectAllMessageStudents(true)">全选</button>
            <button class="btn btn-outline btn-small" @click="adminSelectAllMessageStudents(false)">清空选择</button>
            <span style="color:#6b7a8f;font-size:13px;align-self:center;">已选 <strong id="msgSelectedCount">{{adminMessageSelectedCount}}</strong> 人</span>
          </div>
          <div class="student-select-list" id="msgStudentList" aria-live="polite">
            <div v-if="adminMessageStudentsLoading" class="empty-state">正在加载接收学生…</div>
            <div v-else-if="adminMessageStudentsError" class="empty-state" role="alert">{{adminMessageStudentsError}}</div>
            <div v-else-if="!adminMessageStudents.length" class="empty-state">暂无学生</div>
            <label v-for="s in adminMessageStudents" :key="String(s.studentId)" class="student-option">
              <input type="checkbox" :value="String(s.studentId)" :checked="!!adminMessageSelected[String(s.studentId)]" @change="adminToggleMessageStudent(s.studentId,$event.target.checked)">
              <span class="student-name">{{s.name}}</span><span class="student-id">{{s.studentId}}</span>
            </label>
          </div>
        </div>
        <div class="form-group">
          <label>消息标题</label>
          <input class="form-control" id="msgTitle" placeholder="请输入消息标题" />
        </div>
        <div class="form-group">
          <label>消息内容</label>
          <textarea class="form-control" id="msgContent" rows="5" placeholder="请输入消息内容..."></textarea>
        </div>
        <button class="btn btn-primary" :disabled="adminProgress.busy" @click="invokePageAction('sendCustomMessage', $event.currentTarget)">发送消息</button>
        <div v-if="adminMessageResult" id="msgSendResult" class="admin-vue-result" role="status">{{adminMessageResult}}</div>
      </div>
    </div>

    <!-- 工具 -->
    <div id="tab-tools" class="tab-content" :class="{active:activeTab==='tools'}">
      <div class="card">
        <h2>修改其他账户密码</h2>
        <div class="row">
          <div class="form-group"><label>用户名</label><input class="form-control" id="changePwdUsername" placeholder="用户名" /></div>
          <div class="form-group"><label>新密码（至少8位）</label><input class="form-control" id="changePwdNewPwd" type="password" placeholder="新密码" /></div>
        </div>
        <button class="btn btn-warning" @click="invokePageAction('changePassword', $event.currentTarget)">修改密码</button>
      </div>

      <div class="card">
        <h2>学分申请入口开关</h2>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;">
          <label style="font-weight:500;">申请入口状态：</label>
          <button id="toggleEntryBtn" class="btn" :class="adminEntryEnabled?'btn-danger':'btn-success'" @click="adminEntryEnabled=!adminEntryEnabled">{{adminEntryEnabled?'关闭':'开启'}}</button>
          <span id="entryStatus" class="admin-setting-status" :class="adminEntryEnabled?'state-on':'state-off'">当前：{{adminEntryEnabled?'开启':'关闭'}}</span>
        </div>
        <div class="form-group">
          <label>自定义提示文字（当入口关闭时显示）</label>
          <textarea class="form-control" id="entryMessage" v-model="adminEntryMessage" rows="3"></textarea>
        </div>
        <div class="inline-schedule-settings">
        <fieldset v-for="kind in ['open','close']" :key="kind" class="admin-setting-fieldset">
          <legend>{{kind==='open'?'定时开启':'定时关闭'}}</legend>
          <div class="admin-settings-actions"><label v-for="option in [{value:'none',label:'不设置'},{value:'duration',label:'按时长'},{value:'date',label:'按日期时间'},{value:'daily',label:'每天指定时间'}]" :key="option.value" class="admin-radio-option"><input type="radio" :name="'enabled-'+kind" :value="option.value" v-model="scheduleForms.enabled[kind].mode" @change="scheduleForms.enabled[kind].at=''">{{option.label}}</label></div>
          <div v-if="scheduleForms.enabled[kind].mode==='duration'" class="admin-settings-actions"><label>时 <input type="number" v-model.number="scheduleForms.enabled[kind].hours" min="0" class="admin-number-small"></label><label>分 <input type="number" v-model.number="scheduleForms.enabled[kind].minutes" min="0" max="59" class="admin-number-small"></label></div>
          <input v-if="['date','daily'].includes(scheduleForms.enabled[kind].mode)" :type="scheduleForms.enabled[kind].mode==='daily'?'time':'datetime-local'" v-model="scheduleForms.enabled[kind].at" class="form-control" :aria-label="kind==='open'?'定时开启时间':'定时关闭时间'">
          <p class="admin-muted">{{scheduleForms.enabled[kind].mode==='none'?'不设置定时操作':'北京时间；随下方设置一起保存'}}</p>
        </fieldset><p v-if="scheduleError" role="alert">{{scheduleError}}</p></div>
        <button class="btn btn-primary" @click="invokePageAction('saveEntrySettings', $event.currentTarget)">保存设置</button>
        <div v-if="adminEntryResult" id="entrySaveResult" class="admin-vue-result" role="status">{{adminEntryResult}}</div>
      </div>

      <div class="card">
        <h2>文件上传任务设置</h2>
        <div class="admin-settings-actions"><span id="file-entrance-label">文件上传入口</span><button type="button" class="file-entrance-switch" role="switch" aria-labelledby="file-entrance-label" :aria-checked="fileEntranceEnabled" :aria-busy="fileEntranceSaving" :disabled="fileEntranceSaving || fileTasksLoading" :class="{'is-on':fileEntranceEnabled}" @click="toggleFileEntrance"><span class="file-entrance-thumb"></span></button><span class="file-entrance-state">{{fileEntranceSaving?'保存中…':fileTasksLoading?'加载中…':fileEntranceEnabled?'已开启':'已关闭'}}</span><button type="button" class="btn btn-primary" @click="fileTaskCreate">创建新任务</button></div>
      </div>

      <div class="card">
        <h2>上传要求弹窗</h2>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;">
          <label style="font-weight:500;">弹窗状态：</label>
          <button id="toggleRequirementBtn" class="btn" :class="adminRequirementEnabled?'btn-danger':'btn-success'" @click="adminRequirementEnabled=!adminRequirementEnabled">{{adminRequirementEnabled?'关闭':'开启'}}</button>
          <span id="requirementStatus" class="admin-setting-status" :class="adminRequirementEnabled?'state-on':'state-off'">当前：{{adminRequirementEnabled?'开启':'关闭'}}</span>
        </div>
        <div class="form-group">
          <label>弹窗内容（学生每次打开上传页面时显示）</label>
          <textarea class="form-control" id="requirementMessage" v-model="adminRequirementMessage" rows="5"></textarea>
        </div>
        <button class="btn btn-primary" @click="invokePageAction('saveRequirementSettings', $event.currentTarget)">保存弹窗设置</button>
        <div v-if="adminRequirementResult" id="requirementSaveResult" class="admin-vue-result" role="status">{{adminRequirementResult}}</div>
      </div>

      <div class="card">
        <h2>主页公告</h2>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;">
          <label style="font-weight:500;">公告状态：</label>
          <button id="toggleAnnouncementBtn" class="btn" :class="adminAnnouncementEnabled?'btn-danger':'btn-success'" @click="adminAnnouncementEnabled=!adminAnnouncementEnabled">{{adminAnnouncementEnabled?'关闭':'开启'}}</button>
          <span id="announcementStatus" class="admin-setting-status" :class="adminAnnouncementEnabled?'state-on':'state-off'">当前：{{adminAnnouncementEnabled?'开启':'关闭'}}</span>
        </div>
        <div class="form-group">
          <label>公告标题</label>
          <input type="text" class="form-control" id="announcementTitle" v-model="adminAnnouncementTitle" placeholder="系统公告" />
        </div>
        <div class="form-group">
          <label>公告内容（进入主页时显示关闭提示式通知）</label>
          <textarea class="form-control" id="announcementMessage" v-model="adminAnnouncementMessage" rows="5"></textarea>
        </div>
        <div class="admin-settings-actions">
          <label for="announcementConfirmSwitch">是否显示确定按钮：</label>
          <input type="checkbox" id="announcementConfirmSwitch" v-model="adminAnnouncementShowConfirm" />
          <span class="admin-setting-status" :class="adminAnnouncementShowConfirm?'state-on':'state-off'">{{adminAnnouncementShowConfirm?'显示':'不显示'}}</span>
        </div>
        <p class="admin-setting-hint">不显示时，首页公告会持续显示，不提供确认关闭按钮。</p>
        <div class="inline-schedule-settings">
        <fieldset v-for="kind in ['open','close']" :key="kind" class="admin-setting-fieldset">
          <legend>{{kind==='open'?'定时开启':'定时关闭'}}</legend>
          <div class="admin-settings-actions"><label v-for="option in [{value:'none',label:'不设置'},{value:'duration',label:'按时长'},{value:'date',label:'按日期时间'},{value:'daily',label:'每天指定时间'}]" :key="option.value" class="admin-radio-option"><input type="radio" :name="'announcementEnabled-'+kind" :value="option.value" v-model="scheduleForms.announcementEnabled[kind].mode" @change="scheduleForms.announcementEnabled[kind].at=''">{{option.label}}</label></div>
          <div v-if="scheduleForms.announcementEnabled[kind].mode==='duration'" class="admin-settings-actions"><label>时 <input type="number" v-model.number="scheduleForms.announcementEnabled[kind].hours" min="0" class="admin-number-small"></label><label>分 <input type="number" v-model.number="scheduleForms.announcementEnabled[kind].minutes" min="0" max="59" class="admin-number-small"></label></div>
          <input v-if="['date','daily'].includes(scheduleForms.announcementEnabled[kind].mode)" :type="scheduleForms.announcementEnabled[kind].mode==='daily'?'time':'datetime-local'" v-model="scheduleForms.announcementEnabled[kind].at" class="form-control" :aria-label="kind==='open'?'定时开启时间':'定时关闭时间'">
          <p class="admin-muted">{{scheduleForms.announcementEnabled[kind].mode==='none'?'不设置定时操作':'北京时间；随下方设置一起保存'}}</p>
        </fieldset><p v-if="scheduleError" role="alert">{{scheduleError}}</p></div>
        <button class="btn btn-primary" @click="invokePageAction('saveAnnouncementSettings', $event.currentTarget)">保存公告设置</button>
        <div v-if="adminAnnouncementResult" id="announcementSaveResult" class="admin-vue-result" role="status">{{adminAnnouncementResult}}</div>
      </div>

      <div class="card">
        <h2>清空系统数据</h2>
        <p style="color:#e53e3e;font-weight:600;">警告：此操作将永久删除所有申请数据和学生数据，且不可恢复！</p>
        <button class="btn btn-danger" @click="invokePageAction('clearData', $event.currentTarget)" style="margin-top:12px;">确认清空数据</button>
      </div>
    </div>

    <!-- 文件任务管理 -->
    <div id="tab-files" class="tab-content" :class="{active:activeTab==='files'}">
      <div class="card">

tAttachmentRequired"></label><fieldset class="request-expiry"><legend>申请有效期</legend><label><input type="radio" value="none" v-model="requestExpiryMode">不限制</label><label><input type="radio" value="date" v-model="requestExpiryMode">指定截止时间</label><label><input type="radio" value="duration" v-model="requestExpiryMode">按有效天数</label></fieldset><div v-if="requestExpiryMode==='date'" class="form-group"><label for="request-expiry">截止时间</label><input id="request-expiry" type="datetime-local" class="form-control" v-model="requestExpiresAt" required></div><div v-if="requestExpiryMode==='duration'" class="form-group"><label for="request-duration">有效天数</label><input id="request-duration" type="number" min="1" max="3650" class="form-control" v-model.number="requestDurationDays" required></div><div class="request-preview"><strong>{{requestTitle||'尚未填写活动名称'}}</strong><p>发送给 {{requestSelectedCount}} 位学生</p><p>{{requestAttachmentRequired?'附件必填':'附件选填'}} · {{requestExpiryMode==='none'?'长期有效':requestExpiryMode==='date'?(requestExpiresAt||'请选择截止时间'):requestDurationDays+' 天内有效'}}</p></div></aside></div><footer class="request-compose-footer"><p v-if="requestNotice" role="status">{{requestNotice}}</p><span v-else>发送后，学生可在“管理员发放的申请”中填写提交。</span><button type="submit" class="btn btn-primary" :class="{'request-submit-busy':requestBusy}" :disabled="requestBusy">{{requestBusy?'正在发送…':'发送给 '+requestSelectedCount+' 位学生'}}</button></footer></form></section><section class="tab-content request-workspace" :class="{active:activeTab==='request-activities'}" id="tab-request-activities"><div class="card"><h2>指定申请活动管理</h2><div class="request-actions"><label><input type="checkbox" :checked="assignedRequests.length>0 && assignedRequests.every(t=>requestActivitySelected[t.id])" @change="requestActivitySelected=Object.fromEntries(assignedRequests.map(t=>[t.id,$event.target.checked]))"> 全选活动</label><button type="button" class="btn btn-danger" :disabled="requestListBusy || !Object.values(requestActivitySelected).some(Boolean)" @click="deleteAssignedActivities">删除选中（{{Object.values(requestActivitySelected).filter(Boolean).length}}）</button></div><button class="btn btn-outline btn-small" @click="apiCacheRefreshRequests" :disabled="requestListBusy">{{requestListBusy?'正在刷新…':'刷新'}}</button><div class="app-grid"><article v-for="t in assignedRequests" :key="t.id" class="activity-card-choice"><label class="activity-card-select"><input type="checkbox" v-model="requestActivitySelected[t.id]" :aria-label="'选择活动：'+t.title"><span class="visually-hidden">选择活动</span></label><button type="button" class="app-card assigned-credit-card" @click="requestDetailId=t.id"><div class="app-title">{{t.title}}</div><div class="app-student">{{t.description || '点击查看申请详情与提交材料'}}</div><div class="app-meta"><span class="tag time">{{t.createdAt?adminFormatTime(t.createdAt):'长期有效'}}</span><span class="tag assigned-credit-tag">指定申请</span><span class="tag">{{(t.submissions||[]).length}} / {{(t.studentIds||[]).length}} 已提交</span></div></button></article><p v-if="!assignedRequests.length" class="empty-state">暂无已发送申请</p></div></div>
