<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/pages/admin.css"><link rel="stylesheet" href="../assets/core.css"></head><body class="page-admin"><div class="page-view"><div class="card"><button class="toggle-btn">关闭</button><button class="toggle-btn active">开启</button><button class="toggle-btn active" disabled>系统权限</button><button class="btn btn-outline">刷新</button><button class="btn btn-danger">删除</button><button class="btn btn-success">解封</button><button class="btn btn-primary">发送</button><button class="btn btn-needs-fix">修改</button></div></div><pre id="result"></pre><script>function luminance(s){const x=s.match(/[\d.]+/g).slice(0,3).map(Number).map(v=>{v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)});return x[0]*.2126+x[1]*.7152+x[2]*.0722}let failed=false;const results=[...document.querySelectorAll('button')].map(b=>{const s=getComputedStyle(b),a=luminance(s.color),c=luminance(s.backgroundColor),ratio=(Math.max(a,c)+.05)/(Math.min(a,c)+.05);if(ratio<4.5)failed=true;return b.textContent+' '+ratio.toFixed(2)});document.body.dataset.result=failed?'FAIL':'PASS';document.getElementById('result').textContent=results.join('\n');</script></body></html>
