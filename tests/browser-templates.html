<!doctype html><html><head><meta charset="utf-8"><title>Vue 浏览器解析回归测试</title><script src="../vendor/vue.global.js"></script></head><body><h1>Vue 浏览器解析回归测试</h1><pre id="result"></pre><div id="render-tests"></div><template id="test-admin-tools"><div class="container"><header class="page-header tools-heading"><div class="tools-title"><img src="/assets/icons/command-block.gif" alt=""><div><h1>管理工具</h1><p>选择工具，集中处理日常事务。</p></div></div><button type="button" class="btn btn-outline" :disabled="tool.refreshing||tool.busy" @click="toolApi.refresh()"><span :class="{'tools-spinning':tool.refreshing}">↻</span> {{tool.refreshing?'正在刷新…':'刷新工具'}}</button></header><p v-if="tool.error" class="dashboard-alert" role="alert">{{tool.error}}</p><p v-if="tool.loading" role="status">正在加载管理工具…</p><div v-else><div v-if="tool.panel" class="tabs-wrap tools-tabs"><div class="tabs"><button type="button" class="tab-btn" v-if="tool.permissions.assignedPermission" :class="{active:tool.panel==='compose'}" @click="tool.panel='compose'"><img src="/assets/icons/提交申请.webp" alt="">指定申请</button><button type="button" class="tab-btn" v-if="tool.permissions.messagePermission" :class="{active:tool.panel==='messages'}" @click="tool.panel='messages'"><img src="/assets/icons/我的消息.png" alt="">消息发送</button><button type="button" class="tab-btn" v-if="tool.permissions.filePermission" :class="{active:tool.panel==='files'}" @click="tool.panel='files';toolApi.loadFiles()"><img src="/assets/icons/文件上传.webp" alt="">文件管理</button><button type="button" class="tab-btn" v-if="tool.permissions.canBan" :class="{active:tool.panel==='bans'}" @click="tool.panel='bans';toolApi.loadBans(true)"><img src="/assets/icons/学生登录.webp" alt="">学生封禁</button></div></div><section v-if="tool.panel==='bans' && tool.permissions.canBan" class="card request-compose"><h2>学生封禁</h2><input class="form-control" v-model.trim="tool.search" placeholder="搜索姓名或学号"><article class="request-submission tools-student-row" v-for="s in toolBanFiltered" :key="s.studentId"><div><strong>{{s.name}}</strong><p>{{s.studentId}} · {{s.banned?'已封禁':'正常'}}</p></div><button type="button" class="btn" :class="s.banned?'btn-success':'btn-danger'" :disabled="tool.busy" @click="toolApi.toggleBan(s)">{{s.banned?'解封':'封禁'}}</button></article><p v-if="!toolBanFiltered.length" class="empty-state">暂无匹配学生</p></section><section v-if="tool.panel==='compose' && tool.permissions.assignedPermission" class="request-workspace"><form class="card request-compose" @submit.prevent="createAssignedRequest"><header class="request-compose-heading"><div><div class="request-eyebrow">指定申请 · 创建任务</div><h2>发送学分申请</h2><p>填写活动信息，选择接收学生，设置材料要求与提交时间。</p></div></header><div class="request-compose-grid"><section class="request-compose-main"><div class="request-step"><span>01</span><h3>活动信息</h3></div><div class="form-group"><label for="request-title">活动名称 *</label><input id="request-title" class="form-control" v-model.trim="requestTitle" required maxlength="120" placeholder="例如：志愿服务实践活动"></div><div class="form-group"><label for="request-description">申请说明</label><textarea id="request-description" class="form-control" v-model.trim="requestDescription" rows="4" placeholder="请说明活动内容、填写要求及证明材料要求"></textarea></div><div class="request-step"><span>02</span><h3>选择接收学生</h3><span class="request-selected-count">已选 {{requestSelectedCount}} 人</span></div><div class="request-picker-toolbar"><input class="form-control" type="search" v-model.trim="requestStudentSearch" placeholder="搜索姓名或学号" aria-label="搜索接收学生"><button type="button" class="btn btn-outline" @click="requestSelectAll">全选 / 取消全部</button></div><div class="request-student-list"><label v-for="s in requestStudentsFiltered" :key="String(s.studentId)" class="request-student-option"><input type="checkbox" :checked="!!requestStudentSelected[String(s.studentId)]" @change="requestToggleStudent(s.studentId,$event.target.checked)"><span>{{s.name}}<small>{{s.studentId}}</small></span></label><p v-if="!requestStudentsFiltered.length" class="empty-state">暂无匹配学生</p></div></section><aside class="request-compose-side"><div class="request-step"><span>03</span><h3>提交规则</h3></div><label class="request-switch"><span><strong>必须上传附件</strong><small>活动证明图片始终为必填</small></span><input type="checkbox" role="switch" v-model="requestAttachmentRequired"></label><fieldset class="request-expiry"><legend>申请有效期</legend><label><input type="radio" value="none" v-model="requestExpiryMode">不限制</label><label><input type="radio" value="date" v-model="requestExpiryMode">指定截止时间</label><label><input type="radio" value="duration" v-model="requestExpiryMode">按有效天数</label></fieldset><div v-if="requestExpiryMode==='date'" class="form-group"><label for="request-expiry">截止时间</label><input id="request-expiry" type="datetime-local" class="form-control" v-model="requestExpiresAt" required></div><div v-if="requestExpiryMode==='duration'" class="form-group"><label for="request-duration">有效天数</label><input id="request-duration" type="number" min="1" max="3650" class="form-control" v-model.number="requestDurationDays" required></div><div class="request-preview"><strong>{{requestTitle||'尚未填写活动名称'}}</strong><p>发送给 {{requestSelectedCount}} 位学生</p><p>{{requestAttachmentRequired?'附件必填':'附件选填'}} · {{requestExpiryMode==='none'?'长期有效':requestExpiryMode==='date'?(requestExpiresAt||'请选择截止时间'):requestDurationDays+' 天内有效'}}</p></div></aside></div><footer class="request-compose-footer"><p v-if="requestNotice" role="status">{{requestNotice}}</p><span v-else>发送后，学生可在“管理员发放的申请”中填写提交。</span><button type="submit" class="btn btn-primary" :class="{'request-submit-busy':requestBusy}" :disabled="requestBusy">{{requestBusy?'正在发送…':'发送给 '+requestSelectedCount+' 位学生'}}</button></footer></form></section><form v-if="tool.panel==='messages' && tool.permissions.messagePermission" class="card request-compose" @submit.prevent="toolApi.sendMessages()"><h2>向学生发送消息</h2><div class="form-group"><label>消息标题</label><input class="form-control" v-model.trim="tool.messageTitle" required maxlength="120"></div><div class="form-group"><label>消息内容</label><textarea class="form-control" v-model.trim="tool.messageContent" required rows="5"></textarea></div><input class="form-control" v-model.trim="requestStudentSearch" placeholder="搜索姓名或学号"><button type="button" class="btn btn-outline" @click="requestSelectAll">全选 / 取消全部</button><div class="request-student-list"><label v-for="s in requestStudentsFiltered" :key="s.studentId"><input type="checkbox" v-model="requestStudentSelected[s.studentId]">{{s.name}} · {{s.studentId}}</label></div><p>已选 {{requestSelectedCount}} 位学生</p><button type="submit" class="btn btn-primary" :disabled="tool.busy">{{tool.busy?'正在发送…':'发送消息'}}</button><p role="status">{{tool.notice}}</p></form><section v-if="tool.panel==='files' && tool.permissions.filePermission" class="card request-compose"><h2>学生上传文件</h2><div class="request-actions"><input class="form-control" v-model.trim="tool.search" placeholder="搜索姓名、学号或文件"><button class="btn btn-outline" :disabled="tool.busy" @click="toolApi.loadFiles(true)">{{tool.busy?'正在刷新…':'刷新'}}</button></div><article v-for="row in toolFilesFiltered" :key="row.id" class="request-submission"><h3>{{row.name}} · {{row.studentId}}</h3><p>{{new Date(row.uploadedAt).toLocaleString('zh-CN')}}</p><div class="request-files"><button type="button" class="btn btn-outline" v-for="file in row.files" :key="file" @click="toolApi.download(row,file)">下载 {{file}}</button></div></article><p v-if="!toolFilesFiltered.length" class="empty-state">暂无匹配文件</p></section><div v-if="!tool.panel" class="tools-empty"><img src="/assets/icons/command-block.gif" alt=""><h2>暂无可用工具</h2><p>可点击“刷新工具”重新读取可用功能。</p></div></div></div></template><template id="test-index">
  <div class="container vue-index">
    <div class="page-header">
      <h1>学分总览</h1>
      <div class="nav-actions" aria-label="账户操作">
        <div v-if="indexLoggedIn ? !!indexUser : false" class="user-menu-wrapper">
          <button type="button" class="user-badge" @click.stop="indexMenuOpen=!indexMenuOpen" :aria-expanded="indexMenuOpen" aria-label="账户操作菜单">
            <span class="dot"></span><span>{{indexUser.name}} · {{indexUser.studentId}}</span><span class="caret" :class="{open:indexMenuOpen}">▼</span>
          </button>
          <div class="user-dropdown" v-show="indexMenuOpen">
            <button type="button" class="user-dropdown-item" @click="indexChangePassword">修改密码</button>
            <div class="user-dropdown-divider"></div>
            <button type="button" class="user-dropdown-item danger" @click="indexLogout">退出登录</button>
          </div>
        </div>
      </div>
    </div>
    <section v-if="indexAnnouncementOpen" class="index-announcement-page service-notice announcement-notice" aria-labelledby="announcementNoticeTitle" aria-describedby="announcementNoticeMessage">
      <div class="notice-symbol" aria-hidden="true">!</div>
      <div class="notice-label">服务状态通知</div>
      <h2 id="announcementNoticeTitle">{{indexAnnouncementTitle}}</h2>
      <p id="announcementNoticeMessage" class="announcement-notice-message">{{indexAnnouncementMessage}}</p>
      <div class="announcement-actions"><button v-if="indexAnnouncementShowConfirm" type="button" class="btn announcement-confirm" @click="indexCloseAnnouncement">确定</button><a class="btn btn-primary index-admin-login" href="/login.html">管理员登录</a></div>
    </section>
    <div v-show="!indexAnnouncementOpen" class="index-normal-content">
    <div class="search-bar">
      <input type="search" v-model="indexSearch" @input="indexSearchChanged"  :placeholder="indexTab==='assigned'?'搜索管理员发放的申请...':'搜索姓名、学号或活动名称...'" aria-label="搜索申请" />
      <button type="button" class="refresh-btn" :disabled="indexRefreshing" @click="refreshIndexClick($event)">
        <span :class="{'index-refresh-spinning':indexRefreshing}" aria-hidden="true">↻</span> 刷新
      </button>
    </div>
    <div class="tabs-wrap">
      <div class="tabs" role="tablist" aria-label="学分状态">
        <button type="button" class="tab-btn" role="tab" :aria-selected="indexTab==='pending'" :class="{active:indexTab==='pending'}" @click="indexToggleTab('pending')">待发放的学分</button>
        <button type="button" class="tab-btn" role="tab" :aria-selected="indexTab==='needs-fix'" :class="{active:indexTab==='needs-fix'}" @click="indexToggleTab('needs-fix')">需要修改的学分</button>
        <button type="button" class="tab-btn" role="tab" :aria-selected="indexTab==='assigned'" :class="{active:indexTab==='assigned'}" @click.stop="indexToggleTab('assigned')">管理员发放的申请</button>
      </div>
    </div>
    <section v-if="indexTab==='assigned'" class="assigned-tab-panel" aria-label="管理员发放的申请">
      <div class="app-grid" aria-live="polite">
        <a v-for="task in visibleAssignedTasks" :key="task.id" class="app-card assigned-task-card" :href="task.submitted && task.submission ? '/detail.html?id='+encodeURIComponent('assigned:'+task.id+':'+task.submission.studentId) : '/assigned-request.html?id='+encodeURIComponent(task.id)">
          <div class="app-title">{{task.title || '未命名活动'}}</div>
          <div class="app-student">{{task.description || '管理员发放的学分申请'}}</div>
          <div class="app-meta"><span class="tag time">{{task.expiresAt?'截止：'+new Date(task.expiresAt).toLocaleString('zh-CN'):'无截止时间'}}</span><span class="tag" :class="task.submitted?'approved':task.expired?'rejected':'pending'">{{task.submitted?'待审核':task.expired?'已过期':'待完成'}}</span></div>
        </a>
        <div v-if="!visibleAssignedTasks.length" class="empty-state">{{indexSearchReady ? '没有匹配的申请' : '暂无内容'}}</div>
      </div>
    </section>
    <template v-else>

    <div v-if="indexError" class="empty-state" role="alert">加载失败：{{indexError}}</div>
    <div v-if="indexTab==='needs-fix' ? !indexLoggedIn : false" class="login-prompt">
      <div class="icon" aria-hidden="true">🔒</div>
      <h3>您还未登录</h3><p>登录后可以查看需要修改的学分</p>
      <a class="login-btn" href="/student-login.html?redirect=%2Findex.html">立即登录</a>
    </div>
    <div v-else-if="indexLoading ? !indexApps.length : false" class="app-grid" aria-live="polite">
      <div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div>
    </div>
    <div v-else class="app-grid" aria-live="polite">
      <a v-for="app in visibleIndexApps" :key="app.id" class="app-card" :class="{'assigned-credit-card':app.assigned}" :href="'/detail.html?id='+encodeURIComponent(app.id)">
        <div class="app-title">{{app.versionName || '未命名活动'}}</div>
        <div class="app-student">{{app.name || '未知'}} · {{app.packageName || ''}}</div>
        <div class="app-meta"><span class="tag time">{{app.publisher || ''}}</span><span v-if="app.assigned" class="tag assigned-credit-tag">指定申请</span><span v-if="indexTab==='needs-fix'" class="tag rejected">需要修改</span></div>
        <p v-if="indexTab==='needs-fix' ? !!app.rejectReason : false" class="vue-rejection">驳回原因：{{app.rejectReason}}</p>
      </a>
      <div v-if="!visibleIndexApps.length" class="empty-state">{{indexTab==='pending'?'暂无待发放的学分':'暂无需要修改的学分'}}</div>
    </div>
    </template>
    </div><!-- /.index-normal-content -->
  </div>
  <div class="message-toast-container" aria-live="polite">
    <a v-for="message in indexToasts" :key="message.id" href="/messages.html" class="message-toast system">
      <div class="toast-header"><span class="toast-title">{{message.title}}</span><span class="toast-time">刚刚</span></div>
      <div class="toast-content">{{message.text}}</div>
    </a>
  </div>
</template><template id="test-upload">
  <div class="container">
<div class="back-row">
<h2>填写申请信息</h2>
    </div>
    <form id="applyForm" enctype="multipart/form-data" @submit.prevent="submitApplication">
      <div class="form-row">
        <div class="form-group"><label>申请人姓名 <span class="required">*</span></label><input class="form-control" id="name" v-model="applicationName" required readonly /></div>
        <div class="form-group"><label>申请人学号 <span class="required">*</span></label><input class="form-control" id="studentId" v-model="applicationStudentId" required readonly /></div>
      </div>
      <div class="form-group"><label>活动名称 <span class="required">*</span></label><input class="form-control" id="activity" v-model.trim="applicationActivity" :disabled="applicationSubmitting" required /></div>
      <div class="form-group">
        <label>活动参与名单（xxx，xxx，xxx...）</label>
        <textarea class="form-control" id="participants" v-model.trim="applicationParticipants" :disabled="applicationSubmitting" rows="3" placeholder="例如：张三，李四，王五"></textarea>
        <div class="form-note">如果是全班参加则填写"全班"</div>
      </div>
      <div class="form-group"><label>活动地点 <span class="required">*</span></label><input class="form-control" id="location" v-model.trim="applicationLocation" :disabled="applicationSubmitting" required /></div>
      <div class="form-group">
        <label>活动时间 <span class="required">*</span></label>
        <div class="flatpickr-wrapper">
          <input class="form-control" id="time" v-model="applicationTime" type="datetime-local" :disabled="applicationSubmitting" required />
          <span class="date-icon">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </span>
        </div>
      </div>
      <div class="form-group">
        <label>上传活动证明（至少1张，最多2张）<span class="required">*</span></label>
        <div class="upload-wrapper">
          <div class="upload-control"><input type="file" id="imageUpload" accept="image/*" multiple :disabled="applicationSubmitting || applicationProcessingImages || applicationImages.length>=2" @change="selectApplicationImages($event)" /><span class="upload-badge" id="fileCount">{{applicationImages.length}} / 2</span></div>
          <div class="upload-hint">支持 JPG / PNG / WebP，自动压缩至 700px 宽</div>
          <div class="preview-container" id="preview"><div v-for="(img, idx) in applicationImages" :key="img.key" class="preview-item">
            <button type="button" class="preview-image-button" @click="applicationPreviewSrc=img.url" :aria-label="'查看证明图片 '+(idx+1)"><img :src="img.url" :alt="'证明图片 '+(idx+1)" /></button>
            <button type="button" class="remove-btn" :disabled="applicationSubmitting" @click="removeApplicationImage(idx)" :aria-label="'移除证明图片 '+(idx+1)">×</button>
          </div><span v-if="applicationProcessingImages" class="image-processing" role="status">正在处理图片…</span></div>
        </div>
        <div class="form-validation-hint">请至少上传一张证明图片</div>
      </div>
      <button type="submit" class="btn-submit" :disabled="applicationSubmitting || applicationProcessingImages">{{applicationSubmitting ? '提交中…' : applicationProcessingImages ? '正在处理图片…' : '提交申请'}}</button>

    </form>
  </div>
  <div v-if="applicationPreviewSrc" class="image-modal" role="dialog" aria-modal="true" aria-label="查看证明图片" @click.self="applicationPreviewSrc=''" @keydown.esc="applicationPreviewSrc=''" tabindex="-1"><img :src="applicationPreviewSrc" alt="图片放大预览" /><button type="button" class="image-modal-close" @click="applicationPreviewSrc=''" aria-label="关闭图片预览">×</button></div>
  <div v-if="uploadModalOpen" class="application-progress-overlay" role="presentation" @click.stop>
    <div class="application-progress-dialog" role="dialog" aria-modal="true" aria-labelledby="applicationProgressHeading" aria-describedby="applicationProgressBody" tabindex="-1" @keydown.esc.prevent>
      <div class="application-progress-icon" :class="uploadModalState">
        <span v-if="uploadModalState==='error'" class="application-error-icon">!</span>
        <span v-else-if="uploadModalState==='success'" class="application-success-icon">✓</span>
        <span v-else class="application-progress-spinner"></span>
      </div>
      <h2 id="applicationProgressHeading">{{uploadModalState==='uploading'?'正在上传申请材料…':uploadModalState==='saving'?'正在提交申请…':uploadModalState==='success'?'申请已提交':'提交未成功'}}</h2>
      <p id="applicationProgressBody" class="application-progress-detail">{{uploadModalState==='uploading'?'正在上传活动证明，请勿关闭或返回页面。':uploadModalState==='saving'?'材料已上传，正在等待服务器保存确认。':uploadModalState==='success'?'提交成功，正在前往学分总览…':(uploadModalError || '请检查网络后重试。')}}</p>
      <div v-if="uploadModalState==='uploading' || uploadModalState==='saving'" class="application-progress-track" role="progressbar" :aria-valuenow="uploadModalProgress" aria-valuemin="0" aria-valuemax="100" aria-label="文件上传进度">
        <div class="application-progress-track-fill" :style="{width:uploadModalProgress+'%'}"></div>
      </div>
      <div v-if="uploadModalState==='uploading'" class="application-progress-number">文件上传 {{uploadModalProgress}}%</div>
      <div v-else-if="uploadModalState==='saving'" class="application-progress-number">上传完成 · 等待服务器响应</div>
      <div v-if="uploadModalState==='error'" class="application-progress-actions"><button type="button" @click="dismissUploadError()">关闭并返回表单</button></div>
    </div>
  </div>


  
</template><template id="test-detail">
<div class="container">
<div class="detail-card" id="detailContent" aria-live="polite">
  <div v-if="detailLoading"><button type="button" class="btn detail-back-button" aria-label="返回上一页" title="返回上一页" @click="detailApi.goBack()"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><div class="detail-loader" role="status">正在读取申请详情…</div></div>
  <div v-else-if="detailError" class="error-container" role="alert"><div class="detail-title-row"><button type="button" class="btn detail-back-button" aria-label="返回上一页" title="返回上一页" @click="detailApi.goBack()"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><h2>加载失败</h2></div><p>{{detailError}}</p><button type="button" class="btn btn-primary" @click="detailApi.reload()">重新加载</button><a href="/index.html" class="btn btn-outline">返回首页</a></div>
  <template v-else-if="detailApp">
    <header class="detail-header"><div class="detail-title-row"><button type="button" class="btn detail-back-button" aria-label="返回上一页" title="返回上一页" @click="detailApi.goBack()"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><h2>{{detailCanEdit ? '修改申请' : (detailApp.versionName || '未命名活动')}}</h2></div><div class="sub">{{detailApp.name || '未知'}} · 学号：{{detailApp.packageName || ''}}</div></header>
    <div class="detail-meta"><span v-if="detailApp.assigned" class="tag assigned-credit-tag">指定申请</span><span v-if="!detailCanEdit" class="tag time">{{detailApp.publisher || ''}}</span><span class="tag" :class="detailApp.status==='needs_fix' ? 'needs-fix' : detailApp.status==='approved' ? 'approved':'pending'">{{detailApp.status==='needs_fix'?'需要修改':detailApp.status==='approved'?'已通过':'待审核'}}</span></div>
    <section v-if="detailApp.assigned && !detailCanEdit" class="detail-section"><h3>活动地点</h3><div class="value">{{detailApp.location||'未填写'}}</div></section><section v-if="detailApp.assigned && !detailCanEdit && (detailApp.files||[]).some(f=>f.kind?.startsWith('attachment'))" class="detail-section"><h3>申请附件</h3><button type="button" class="btn btn-outline" v-for="file in (detailApp.files||[]).filter(f=>f.kind?.startsWith('attachment'))" :key="file.name" @click="detailApi.downloadAttachment(file)">{{file.originalName||file.name}}</button></section><section v-if="detailApp.rejectReason" class="detail-section reject-reason"><h3>驳回原因</h3><div class="value">{{detailApp.rejectReason}}</div></section>
    <template v-if="!detailCanEdit">

<section id="tab-requests" class="tab-content request-workspace" :class="{active:activeTab==='requests'}"><form class="card request-compose" @submit.prevent="createAssignedRequest"><header class="request-compose-heading"><div><div class="request-eyebrow">指定申请 · 创建任务</div><h2>发送学分申请</h2><p>填写活动信息，选择接收学生，设置材料要求与提交时间。</p></div><a class="btn btn-outline" href="/dashboard.html">前往审核台</a></header><div class="request-compose-grid"><section class="request-compose-main"><div class="request-step"><span>01</span><h3>活动信息</h3></div><div class="form-group"><label for="request-title">活动名称 *</label><input id="request-title" class="form-control" v-model.trim="requestTitle" required maxlength="120" placeholder="例如：志愿服务实践活动"></div><div class="form-group"><label for="request-description">申请说明</label><textarea id="request-description" class="form-control" v-model.trim="requestDescription" rows="4" placeholder="请说明活动内容、填写要求及证明材料要求"></textarea></div><div class="request-step"><span>02</span><h3>选择接收学生</h3><span class="request-selected-count">已选 {{requestSelectedCount}} 人</span></div><div class="request-picker-toolbar"><input class="form-control" type="search" v-model.trim="requestStudentSearch" placeholder="搜索姓名或学号" aria-label="搜索接收学生"><button type="button" class="btn btn-outline" @click="requestSelectAll">全选 / 取消全部</button></div><div class="request-student-list"><label v-for="s in requestStudentsFiltered" :key="String(s.studentId)" class="request-student-option"><input type="checkbox" :checked="!!requestStudentSelected[String(s.studentId)]" @change="requestToggleStudent(s.studentId,$event.target.checked)"><span>{{s.name}}<small>{{s.studentId}}</small></span></label><p v-if="!requestStudentsFiltered.length" class="empty-state">暂无匹配学生</p></div></section><aside class="request-compose-side"><div class="request-step"><span>03</span><h3>提交规则</h3></div><label class="request-switch"><span><strong>必须上传附件</strong><small>活动证明图片始终为必填</small></span><input type="checkbox" role="switch" v-model="requestAttachmentRequired"></label><fieldset class="request-expiry"><legend>申请有效期</legend><label><input type="radio" value="none" v-model="requestExpiryMode">不限制</label><label><input type="radio" value="date" v-model="requestExpiryMode">指定截止时间</label><label><input type="radio" value="duration" v-model="requestExpiryMode">按有效天数</label></fieldset><div v-if="requestExpiryMode==='date'" class="form-group"><label for="request-expiry">截止时间</label><input id="request-expiry" type="datetime-local" class="form-control" v-model="requestExpiresAt" required></div><div v-if="requestExpiryMode==='duration'" class="form-group"><label for="request-duration">有效天数</label><input id="request-duration" type="number" min="1" max="3650" class="form-control" v-model.number="requestDurationDays" required></div><div class="request-preview"><strong>{{requestTitle||'尚未填写活动名称'}}</strong><p>发送给 {{requestSelectedCount}} 位学生</p><p>{{requestAttachmentRequired?'附件必填':'附件选填'}} · {{requestExpiryMode==='none'?'长期有效':requestExpiryMode==='date'?(requestExpiresAt||'请选择截止时间'):requestDurationDays+' 天内有效'}}</p></div></aside></div><footer class="request-compose-footer"><p v-if="requestNotice" role="status">{{requestNotice}}</p><span v-else>发送后，学生可在“管理员发放的申请”中填写提交。</span><button type="submit" class="btn btn-primary" :class="{'request-submit-busy':requestBusy}" :disabled="requestBusy">{{requestBusy?'正在发送…':'发送给 '+requestSelectedCount+' 位学生'}}</button></footer></form></section><section class="tab-content request-workspace" :class="{active:activeTab==='request-activities'}" id="tab-request-activities"><div class="card"><h2>指定申请活动管理</h2><div class="request-actions"><label><input type="checkbox" :checked="assignedRequests.length>0 && assignedRequests.every(t=>requestActivitySelected[t.id])" @change="requestActivitySelected=Object.fromEntries(assignedRequests.map(t=>[t.id,$event.target.checked]))"> 全选活动</label><button type="button" class="btn btn-danger" :disabled="requestListBusy || !Object.values(requestActivitySelected).some(Boolean)" @click="deleteAssignedActivities">删除选中（{{Object.values(requestActivitySelected).filter(Boolean).length}}）</button></div><button class="btn btn-outline btn-small" @click="apiCacheRefreshRequests" :disabled="requestListBusy">{{requestListBusy?'正在刷新…':'刷新'}}</button><div class="request-card-grid"><article v-for="t in assignedRequests" :key="t.id" class="activity-select-card"><label class="activity-select"><input type="checkbox" v-model="requestActivitySelected[t.id]"> 选择活动</label><button type="button" class="request-summary" @click="requestDetailId=t.id"><span class="request-eyebrow">指定申请</span><h3>{{t.title}}</h3><p>{{t.description || '点击查看申请详情与提交材料'}}</p><div class="request-stats"><span>{{(t.studentIds||[]).length}} 位学生</span><span>{{(t.submissions||[]).length}} 份提交</span><span>{{(t.submissions||[]).filter(s=>(s.status||'pending')==='pending').length}} 待审核</span></div><small>截止：{{t.expiresAt?adminFormatTime(t.expiresAt):'长期有效'}}</small></button></article><p v-if="!assignedRequests.length" class="empty-state">暂无已发送申请</p></div></div>
